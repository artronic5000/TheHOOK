<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>HOOKED Face Filter</title>


<!-- =========================
     A-FRAME + MINDAR
     ========================= -->

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>


<style>

/* =====================================================
   PAGE
   ===================================================== */

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: transparent;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


/* =====================================================
   GENERAL BUTTON
   ===================================================== */

button {

  appearance: none;
  -webkit-appearance: none;

  border: 2px solid #fff5e6;

  background: #cf6537;
  color: #fff5e6;

  padding: 11px 16px;

  border-radius: 24px;

  font-size: 12px;
  font-weight: bold;

  letter-spacing: 1px;

  box-shadow:
    0 4px 12px
    rgba(0,0,0,.4);

  cursor: pointer;
}


button:active {

  transform: scale(.96);

}


/* =====================================================
   TOP BUTTONS
   ===================================================== */

#backButton,
#cameraButton {

  position: fixed;

  top: 18px;

  z-index: 3000;

  background:
    rgba(0,0,0,.68);

}


#backButton {

  left: 16px;

}


#cameraButton {

  right: 16px;

  width: 46px;
  height: 46px;

  padding: 0;

  font-size: 22px;

  border-radius: 50%;

}


/* =====================================================
   BOTTOM CONTROL BAR
   ===================================================== */

#controls {

  position: fixed;

  left: 8px;
  right: 8px;

  bottom:
    max(
      14px,
      env(safe-area-inset-bottom)
    );

  z-index: 3000;

  display: flex;

  justify-content: center;
  align-items: flex-end;

  gap: 12px;

}


/* =====================================================
   KITTY BUTTON
   ===================================================== */

#kittyButton {

  width: 92px;

  padding: 0;

  border: none;

  background: transparent;

  box-shadow: none;

  display: flex;

  flex-direction: column;

  justify-content: flex-end;
  align-items: center;

  gap: 2px;

}


#kittyImage {

  display: block;

  width: 68px;
  height: 68px;

  object-fit: contain;

  transform-origin:
    50% 85%;

  filter:
    drop-shadow(
      0 4px 6px
      rgba(0,0,0,.65)
    );

  animation:
    kittyIdle
    2.4s
    ease-in-out
    infinite;

}


#kittyLabel {

  color: #fff5e6;

  font-size: 9px;
  font-weight: 900;

  letter-spacing: 1px;

  text-shadow:
    0 2px 5px
    rgba(0,0,0,.9);

  white-space: nowrap;

}


@keyframes kittyIdle {

  0% {

    transform:
      translateY(0)
      rotate(0deg)
      scale(1);

  }

  25% {

    transform:
      translateY(-5px)
      rotate(-3deg)
      scale(1.04);

  }

  50% {

    transform:
      translateY(0)
      rotate(0deg)
      scale(1);

  }

  75% {

    transform:
      translateY(-4px)
      rotate(3deg)
      scale(1.04);

  }

  100% {

    transform:
      translateY(0)
      rotate(0deg)
      scale(1);

  }

}


#kittyImage.kittyClicked {

  animation:
    kittyClick
    .55s
    ease-out;

}


@keyframes kittyClick {

  0% {

    transform:
      scale(1)
      rotate(0deg);

  }

  30% {

    transform:
      scale(1.22)
      rotate(-8deg);

  }

  60% {

    transform:
      scale(.92)
      rotate(7deg);

  }

  100% {

    transform:
      scale(1)
      rotate(0deg);

  }

}


/* =====================================================
   BUBBLE + PHOTO BUTTONS
   ===================================================== */

#bubbleButton,
#photoButton {

  min-width: 92px;

  min-height: 46px;

  padding:
    11px 13px;

  margin-bottom: 8px;

}


/* =====================================================
   BUBBLES
   ===================================================== */

#bubbleLayer {

  position: fixed;

  inset: 0;

  z-index: 800;

  overflow: hidden;

  pointer-events: none;

}


.bubble {

  position: absolute;

  border-radius: 50%;

  border:
    1.5px solid
    rgba(255,255,255,.90);

  background:
    rgba(255,255,255,.10);

  box-shadow:

    inset
    3px 3px 3px
    rgba(255,255,255,.38),

    0 0 4px
    rgba(255,255,255,.22);

  animation:
    floatBubble
    3.2s
    ease-out
    forwards;

}


.pop-ring {

  position: fixed;

  border-radius: 50%;

  border:
    1.5px solid
    rgba(255,255,255,.90);

  background:
    transparent;

  pointer-events: none;

  z-index: 801;

  animation:
    bubblePopRing
    220ms
    ease-out
    forwards;

}


@keyframes floatBubble {

  0% {

    opacity: 0;

    transform:
      translate(0,0)
      scale(.35);

  }

  12% {

    opacity: 1;

  }

  100% {

    opacity: 0;

    transform:
      translate(
        var(--drift),
        var(--rise)
      )
      scale(1.35);

  }

}


@keyframes bubblePopRing {

  0% {

    opacity: 1;

    transform:
      scale(.7);

  }

  60% {

    opacity: .8;

  }

  100% {

    opacity: 0;

    transform:
      scale(1.45);

  }

}


/* =====================================================
   TIP INFORMATION OVERLAY
   ===================================================== */

#tipOverlay {

  position: fixed;

  inset: 0;

  z-index: 7000;

  display: none;

  justify-content: center;
  align-items: center;

  padding: 20px;

  box-sizing: border-box;

  background:
    rgba(0,0,0,.82);

}


#tipImageBox {

  display: flex;

  flex-direction: column;

  justify-content: center;
  align-items: center;

  width:
    min(
      90vw,
      430px
    );

}


#tipInfoImage {

  display: block;

  width: 100%;
  height: auto;

  max-height: 75vh;

  object-fit: contain;

  filter:
    drop-shadow(
      0 8px 25px
      rgba(0,0,0,.65)
    );

}


#closeTipButton {

  margin-top: 14px;

  padding:
    11px 24px;

}


/* =====================================================
   COUNTDOWN
   ===================================================== */

#countdownOverlay {

  position: fixed;

  inset: 0;

  z-index: 8000;

  display: none;

  flex-direction: column;

  justify-content: center;
  align-items: center;

  pointer-events: none;

  color: white;

  text-align: center;

  background:
    rgba(0,0,0,.12);

  text-shadow:
    0 3px 12px
    rgba(0,0,0,.9);

}


#lookText {

  font-size:
    clamp(
      22px,
      6vw,
      38px
    );

  font-weight: 900;

  letter-spacing: 3px;

  line-height: 1.2;

  margin-bottom: 25px;

}


#countdownNumber {

  font-size:
    clamp(
      90px,
      30vw,
      180px
    );

  font-weight: 900;

  line-height: 1;

}


/* =====================================================
   CAMERA FLASH
   ===================================================== */

#cameraFlash {

  position: fixed;

  inset: 0;

  z-index: 8500;

  background: white;

  opacity: 0;

  pointer-events: none;

}


#cameraFlash.flash {

  animation:
    cameraFlashAnimation
    260ms
    ease-out;

}


@keyframes cameraFlashAnimation {

  0% {

    opacity: 0;

  }

  20% {

    opacity: .95;

  }

  100% {

    opacity: 0;

  }

}


/* =====================================================
   FINISHED POLAROID
   ===================================================== */

#photoResult {

  position: fixed;

  inset: 0;

  z-index: 9000;

  display: none;

  flex-direction: column;

  justify-content: center;
  align-items: center;

  padding: 18px;

  box-sizing: border-box;

  background:
    rgba(0,0,0,.94);

}


#finishedPhoto {

  display: block;

  max-width: 94vw;
  max-height: 76vh;

  width: auto;
  height: auto;

  object-fit: contain;

  filter:
    drop-shadow(
      0 10px 24px
      rgba(0,0,0,.65)
    );

}


#photoButtons {

  display: flex;

  justify-content: center;

  gap: 12px;

  margin-top: 18px;

}


#savePhotoButton {

  background: #cf6537;

}


#retakeButton {

  background:
    rgba(0,0,0,.65);

}


/* =====================================================
   A-FRAME
   ===================================================== */

a-scene {

  position: fixed !important;

  inset: 0 !important;

}

@keyframes loadingDot {

  0%,
  80%,
  100% {

    opacity: .3;

    transform:
      translateY(0);

  }

  40% {

    opacity: 1;

    transform:
      translateY(-7px);

  }

}
</style>

</head>


<body>

<!-- =====================================================
     TOP CONTROLS
     ===================================================== -->

<button
  id="backButton"
  type="button"
>
  ← BACK
</button>


<button
  id="cameraButton"
  type="button"
  aria-label="Reverse camera"
>
  ↻
</button>



<!-- =====================================================
     SCREEN BUBBLES
     ===================================================== -->

<div id="bubbleLayer"></div>



<!-- =====================================================
     CAMERA FLASH
     ===================================================== -->

<div id="cameraFlash"></div>



<!-- =====================================================
     BOTTOM CONTROLS
     ===================================================== -->

<div id="controls">


  <!-- CLICK KITTY -->

  <button
    id="kittyButton"
    type="button"
  >

    <img
      id="kittyImage"
      src="./tip1.png"
      alt="Tip The Hook"
    >

    <span id="kittyLabel">
      CLICK KITTY
    </span>

  </button>



  <!-- BUBBLES -->

  <button
    id="bubbleButton"
    type="button"
  >
    BUBBLES
  </button>



  <!-- PHOTO -->

  <button
    id="photoButton"
    type="button"
  >
    📷 PHOTO
  </button>


</div>



<!-- =====================================================
     TIP INFORMATION
     ===================================================== -->

<div id="tipOverlay">

  <div id="tipImageBox">

    <img
      id="tipInfoImage"
      alt="Tip The Hook"
    >

    <button
      id="closeTipButton"
      type="button"
    >
      CLOSE
    </button>

  </div>

</div>



<!-- =====================================================
     COUNTDOWN
     ===================================================== -->

<div id="countdownOverlay">

  <div id="lookText">

    LOOK AT THE
    <br>
    CAMERA LENS

  </div>

  <div id="countdownNumber">
    3
  </div>

</div>



<!-- =====================================================
     FINISHED PHOTO
     ===================================================== -->

<div id="photoResult">

  <img
    id="finishedPhoto"
    alt="The Hook Polaroid"
  >

  <div id="photoButtons">

    <button
      id="savePhotoButton"
      type="button"
    >
      SAVE PHOTO
    </button>

    <button
      id="retakeButton"
      type="button"
    >
      RETAKE
    </button>

  </div>

</div>



<!-- =====================================================
     FACE FILTER
     ===================================================== -->

<a-scene

  id="faceScene"

  mindar-face="
    autoStart: true;
    uiLoading: no;
    uiScanning: no;
    uiError: no;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
    preserveDrawingBuffer: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

>


<!-- =====================================================
     ASSETS
     ===================================================== -->

<a-assets>


  <!-- EARS -->

  <img
    id="earsGraphic"
    src="./ears.png"
    crossorigin="anonymous"
  >


  <!-- SUNGLASSES -->

  <img
    id="sunglassesGraphic"
    src="./sunglasses.png"
    crossorigin="anonymous"
  >


  <!-- BUBBLE CIGARETTE -->

  <img
    id="cigyBubblesGraphic"
    src="./cigybubbles.png"
    crossorigin="anonymous"
  >

</a-assets>



<!-- =====================================================
     A-FRAME CAMERA
     ===================================================== -->

<a-camera

  active="true"

  position="0 0 0"

>
</a-camera>



<!-- =====================================================
     CAT EARS
     ===================================================== -->

<a-entity

  id="earsAnchor"

  mindar-face-target="
    anchorIndex: 10
  "

>

  <a-image

    id="earsOverlay"

    src="#earsGraphic"

    position="
      -.3
      0.25
      0.04
    "

    width="1.75"

    height="0.65"

    material="
      shader: flat;
      transparent: true;
      side: double;
      depthWrite: false;
    "

  >
  </a-image>

</a-entity>



<!-- =====================================================
     FACE / MOUTH ANCHOR
     ===================================================== -->

<a-entity

  id="mouthAnchor"

  mindar-face-target="
    anchorIndex: 1
  "

>


  <!-- SUNGLASSES -->

  <a-image

    id="sunglassesOverlay"

    src="#sunglassesGraphic"

    position="
      -.25
      0.16
      0.06
    "

    width="1.65"

    height="0.59"

    material="
      shader: flat;
      transparent: true;
      side: double;
      depthWrite: false;
    "

  >
  </a-image>



  <!-- BUBBLE CIGARETTE -->

  <a-image

    id="cigyBubblesOverlay"

    src="#cigyBubblesGraphic"

    position="
      0.03
      -0.25
      0.07
    "

    width="1.05"

    height="0.70"

    material="
      shader: flat;
      transparent: true;
      side: double;
      depthWrite: false;
    "

  >
  </a-image>


</a-entity>


</a-scene>



<script>

/* =====================================================
   ELEMENTS
   ===================================================== */

const bubbleLayer =
  document.getElementById(
    "bubbleLayer"
  );


const scene =
  document.getElementById(
    "faceScene"
  );


const kittyButton =
  document.getElementById(
    "kittyButton"
  );


const kittyImage =
  document.getElementById(
    "kittyImage"
  );


const tipOverlay =
  document.getElementById(
    "tipOverlay"
  );


const closeTipButton =
  document.getElementById(
    "closeTipButton"
  );


const photoButton =
  document.getElementById(
    "photoButton"
  );


const countdownOverlay =
  document.getElementById(
    "countdownOverlay"
  );


const countdownNumber =
  document.getElementById(
    "countdownNumber"
  );


const photoResult =
  document.getElementById(
    "photoResult"
  );


const finishedPhoto =
  document.getElementById(
    "finishedPhoto"
  );


const savePhotoButton =
  document.getElementById(
    "savePhotoButton"
  );


const retakeButton =
  document.getElementById(
    "retakeButton"
  );


const cameraFlash =
  document.getElementById(
    "cameraFlash"
  );


let finishedPhotoURL = null;



/* =====================================================
   BACK BUTTON
   ===================================================== */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "./index.html";

    }
  );



/* =====================================================
   CLICK KITTY
   ===================================================== */

kittyButton.addEventListener(
  "click",
  () => {

    kittyImage.classList.remove(
      "kittyClicked"
    );

    void kittyImage.offsetWidth;

    kittyImage.classList.add(
      "kittyClicked"
    );


    const tipImage =
      document.getElementById(
        "tipInfoImage"
      );


    /* Load tip image only when needed */

    if (!tipImage.src) {

      tipImage.src =
        "./tipinfo.png";

    }


    setTimeout(
      () => {

        tipOverlay.style.display =
          "flex";

      },
      350
    );


    setTimeout(
      () => {

        kittyImage.classList.remove(
          "kittyClicked"
        );

      },
      600
    );

  }
);



/* =====================================================
   CLOSE TIP INFORMATION
   ===================================================== */

closeTipButton.addEventListener(
  "click",
  () => {

    tipOverlay.style.display =
      "none";

  }
);


tipOverlay.addEventListener(
  "click",
  event => {

    if (
      event.target === tipOverlay
    ) {

      tipOverlay.style.display =
        "none";

    }

  }
);



/* =====================================================
   CREATE SCREEN BUBBLE
   ===================================================== */

function makeBubble() {

  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const size =
    28 +
    Math.random() * 42;


  bubble.style.width =
    size + "px";


  bubble.style.height =
    size + "px";



  /* -----------------------------------------
     FOLLOW BUBBLE CIGARETTE
     ----------------------------------------- */

  const cigy =
    document.getElementById(
      "cigyBubblesOverlay"
    );


  const cameraElement =
    document.querySelector(
      "a-camera"
    );


  if (
    !cigy ||
    !cigy.object3D ||
    !cameraElement
  ) {

    return;

  }


  const camera =
    cameraElement.getObject3D(
      "camera"
    );


  if (!camera) {

    return;

  }


  const tipPosition =
    new THREE.Vector3();


  /*
    Cigarette tip position relative
    to cigybubbles.png.

    These can be fine-tuned later.
  */

  tipPosition.set(
    0.40,
    0.02,
    0
  );


  cigy.object3D.localToWorld(
    tipPosition
  );


  tipPosition.project(
    camera
  );


  const startX =

    (
      tipPosition.x *
      .5 +
      .5
    )

    *

    window.innerWidth;


  const startY =

    (
      -tipPosition.y *
      .5 +
      .5
    )

    *

    window.innerHeight;



  bubble.style.left =
    startX + "px";


  bubble.style.top =
    startY + "px";



  const drift =
    35 +
    Math.random() * 100;


  const rise =
    -(
      100 +
      Math.random() * 190
    );


  bubble.style.setProperty(
    "--drift",
    drift + "px"
  );


  bubble.style.setProperty(
    "--rise",
    rise + "px"
  );


  bubbleLayer.appendChild(
    bubble
  );



  /* -----------------------------------------
     RANDOM POP
     ----------------------------------------- */

  const willPop =
    Math.random() < .65;


  if (willPop) {

    const popTime =
      900 +
      Math.random() * 1600;


    setTimeout(
      () => {

        if (
          !bubble.isConnected
        ) {

          return;

        }


        const rect =
          bubble.getBoundingClientRect();


        const ring =
          document.createElement(
            "div"
          );


        ring.className =
          "pop-ring";


        ring.style.width =
          rect.width + "px";


        ring.style.height =
          rect.height + "px";


        ring.style.left =
          rect.left + "px";


        ring.style.top =
          rect.top + "px";


        bubbleLayer.appendChild(
          ring
        );


        bubble.style.animation =
          "none";


        bubble.animate(

          [

            {

              transform:
                "scale(1)",

              opacity: 1

            },

            {

              transform:
                "scale(1.18)",

              opacity: 0

            }

          ],

          {

            duration: 100,

            easing:
              "ease-out",

            fill:
              "forwards"

          }

        );


        setTimeout(
          () => {

            bubble.remove();

          },
          110
        );


        setTimeout(
          () => {

            ring.remove();

          },
          240
        );

      },

      popTime

    );

  }



  setTimeout(
    () => {

      if (
        bubble.isConnected
      ) {

        bubble.remove();

      }

    },
    3300
  );

}



/* =====================================================
   BUBBLES BUTTON
   ===================================================== */

document
  .getElementById(
    "bubbleButton"
  )
  .addEventListener(
    "click",
    () => {

      for (
        let i = 0;
        i < 7;
        i++
      ) {

        setTimeout(
          () => {

            makeBubble();

          },

          i * 170

        );

      }

    }
  );



/* =====================================================
   CAMERA REVERSE
   ===================================================== */

document
  .getElementById(
    "cameraButton"
  )
  .addEventListener(
    "click",
    async () => {

      try {

        const system =
          scene.systems[
            "mindar-face-system"
          ];


        if (
          system &&
          system.switchCamera
        ) {

          await system
            .switchCamera();

        }

      }

      catch (error) {

        console.log(
          "Camera switch:",
          error
        );

      }

    }
  );



/* =====================================================
   WAIT
   ===================================================== */

function wait(ms) {

  return new Promise(
    resolve => {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}



/* =====================================================
   PHOTO BUTTON
   ===================================================== */

photoButton.addEventListener(
  "click",
  async () => {

    countdownOverlay.style.display =
      "flex";


    countdownNumber.textContent =
      "3";


    await wait(800);


    countdownNumber.textContent =
      "2";


    await wait(800);


    countdownNumber.textContent =
      "1";


    await wait(800);


    countdownOverlay.style.display =
      "none";


    cameraFlash.classList.remove(
      "flash"
    );


    void cameraFlash.offsetWidth;


    cameraFlash.classList.add(
      "flash"
    );


    await wait(100);


    try {

      await createPolaroid();

    }

    catch (error) {

      console.error(
        "Photo error:",
        error
      );


      alert(
        "The photo could not be created. Please try again."
      );

    }

  }
);



/* =====================================================
   CREATE POLAROID

   IMPORTANT:

   This captures ONLY the regular camera image.

   It does NOT put:
   - ears
   - sunglasses
   - cigarette
   - AR graphics
   - illustration filter

   into the saved selfie.

   polaroid.png is then drawn over the photo.
   ===================================================== */

async function createPolaroid() {


  const outputSize =
    1400;


  const outputCanvas =
    document.createElement(
      "canvas"
    );


  outputCanvas.width =
    outputSize;


  outputCanvas.height =
    outputSize;


  const ctx =
    outputCanvas.getContext(
      "2d"
    );



  /* -----------------------------------------
     OPEN PHOTO AREA IN POLAROID.PNG
     ----------------------------------------- */

  const photoX =
    outputSize * .075;


  const photoY =
    outputSize * .075;


  const photoW =
    outputSize * .85;


  const photoH =
    outputSize * .72;



  /* -----------------------------------------
     LIVE CAMERA
     ----------------------------------------- */

  const video =
    document.querySelector(
      "video"
    );


  if (
    !video ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    alert(
      "Camera is still loading. Try again."
    );

    return;

  }



  /* -----------------------------------------
     CAMERA SOURCE SIZE
     ----------------------------------------- */

  const sourceW =
    video.videoWidth;


  const sourceH =
    video.videoHeight;


  const targetRatio =
    photoW /
    photoH;


  const sourceRatio =
    sourceW /
    sourceH;


  let sx = 0;
  let sy = 0;

  let sw =
    sourceW;

  let sh =
    sourceH;



  /*
    Crop camera to the Polaroid opening.
  */

  if (
    sourceRatio >
    targetRatio
  ) {

    sw =
      sourceH *
      targetRatio;


    sx =
      (
        sourceW -
        sw
      ) / 2;

  }

  else {

    sh =
      sourceW /
      targetRatio;


    sy =
      (
        sourceH -
        sh
      ) / 2;

  }



  /* -----------------------------------------
     DARK BACKGROUND BEHIND PHOTO
     ----------------------------------------- */

  ctx.fillStyle =
    "#111";


  ctx.fillRect(
    photoX,
    photoY,
    photoW,
    photoH
  );



  /* -----------------------------------------
     REGULAR SELFIE

     0.88 leaves a little more of the person
     visible rather than zooming tightly into
     the face.
     ----------------------------------------- */

  const selfieScale =
    .88;


  const drawW =
    photoW *
    selfieScale;


  const drawH =
    photoH *
    selfieScale;


  const drawX =
    photoX +
    (
      photoW -
      drawW
    ) / 2;


  const drawY =
    photoY +
    (
      photoH -
      drawH
    ) / 2;



  ctx.save();


  ctx.beginPath();


  ctx.rect(
    photoX,
    photoY,
    photoW,
    photoH
  );


  ctx.clip();



  /*
    Mirror front-camera selfie.
  */

  ctx.translate(
    drawX + drawW,
    drawY
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(

    video,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    drawW,
    drawH

  );


  ctx.restore();



/* -----------------------------------------
   LOAD POLAROID ONLY NOW
   ----------------------------------------- */

const polaroid =
  new Image();


polaroid.crossOrigin =
  "anonymous";


const polaroidReady =
  new Promise(
    (resolve, reject) => {

      polaroid.onload =
        resolve;

      polaroid.onerror =
        reject;

    }
  );


polaroid.src =
  "./polaroid.png";


await polaroidReady;


/* Draw Polaroid over selfie */

ctx.drawImage(

  polaroid,

  0,
  0,

  outputSize,
  outputSize

);

  /* -----------------------------------------
     CURRENT DATE
     ----------------------------------------- */

  const today =
    new Date();


  const dateText =

    String(
      today.getMonth() + 1
    ).padStart(
      2,
      "0"
    )

    +

    "/"

    +

    String(
      today.getDate()
    ).padStart(
      2,
      "0"
    )

    +

    "/"

    +

    String(
      today.getFullYear()
    ).slice(-2);



  ctx.save();


  ctx.fillStyle =
    "#111";


  ctx.font =
    "bold 30px Arial";


  ctx.textAlign =
    "left";


  ctx.textBaseline =
    "middle";


  ctx.fillText(

    dateText,

    outputSize * .817,

    outputSize * .885

  );


  ctx.restore();



  /* -----------------------------------------
     SHOW RESULT
     ----------------------------------------- */

  finishedPhotoURL =
    outputCanvas.toDataURL(
      "image/png"
    );


  finishedPhoto.src =
    finishedPhotoURL;


  photoResult.style.display =
    "flex";

}



/* =====================================================
   RETAKE
   ===================================================== */

retakeButton.addEventListener(
  "click",
  () => {

    photoResult.style.display =
      "none";


    finishedPhoto.src =
      "";


    finishedPhotoURL =
      null;

  }
);



/* =====================================================
   SAVE / SHARE PHOTO
   ===================================================== */

savePhotoButton.addEventListener(
  "click",
  async () => {

    if (!finishedPhotoURL) {
      return;
    }


    try {

      /* Convert finished image to a real file */

      const response =
        await fetch(finishedPhotoURL);

      const blob =
        await response.blob();


      const today =
        new Date();


      const filename =
        "the-hook-" +
        today.getFullYear() +
        "-" +
        String(
          today.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
          today.getDate()
        ).padStart(2, "0") +
        ".png";


      const file =
        new File(
          [blob],
          filename,
          {
            type: "image/png"
          }
        );


      /* iPhone / modern mobile browser */

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
          files: [file]
        })
      ) {

        await navigator.share({
          files: [file],
          title: "The Hook"
        });

      }

      else {

        /* Fallback for browsers without file sharing */

        const link =
          document.createElement("a");

        link.href =
          finishedPhotoURL;

        link.download =
          filename;

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

      }

    }

    catch (error) {

      console.log(
        "Save/share cancelled:",
        error
      );

    }

  }
);

</script>
