<!DOCTYPE html>
<html lang="en">

<title>HOOKED Face Filter</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

button {
  appearance: none;
  -webkit-appearance: none;
  border: 2px solid #fff5e6;
  background: #cf6537;
  color: #fff5e6;
  padding: 12px 17px;
  border-radius: 24px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
}

button:active {
  transform: scale(.96);
}


/* =========================
   TOP BUTTONS
   ========================= */

#backButton,
#cameraButton {
  position: fixed;
  top: 18px;
  z-index: 2000;
  background: rgba(0,0,0,.70);
}

#backButton {
  left: 16px;
  padding: 10px 14px;
  font-size: 13px;
}

#cameraButton {
  right: 16px;
  padding: 10px 14px;
  font-size: 18px;
}


/* =========================
   BOTTOM BUTTONS
   ========================= */

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 25px;
  z-index: 2000;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}


/* =========================
   BUBBLES
   ========================= */

#bubbleLayer {
  position: fixed;
  inset: 0;
  z-index: 800;
  overflow: hidden;
  pointer-events: none;
}

.bubble {
  position: absolute;
  border-radius: 50%;

  border:
    1.5px solid
    rgba(255,255,255,.90);

  background:
    rgba(255,255,255,.10);

  box-shadow:
    inset 3px 3px 3px rgba(255,255,255,.38),
    0 0 4px rgba(255,255,255,.22);

  animation:
    floatBubble 3.2s ease-out forwards;
}

.pop-ring {
  position: fixed;
  border-radius: 50%;

  border:
    1.5px solid
    rgba(255,255,255,.9);

  background: transparent;

  pointer-events: none;
  z-index: 801;

  animation:
    bubblePopRing 220ms ease-out forwards;
}

@keyframes floatBubble {

  0% {
    opacity: 0;
    transform:
      translate(0,0)
      scale(.35);
  }

  12% {
    opacity: 1;
  }

  100% {
    opacity: 0;

    transform:
      translate(
        var(--drift),
        var(--rise)
      )
      scale(1.35);
  }
}

@keyframes bubblePopRing {

  0% {
    opacity: 1;
    transform: scale(.7);
  }

  60% {
    opacity: .8;
  }

  100% {
    opacity: 0;
    transform: scale(1.45);
  }
}


/* =========================
   CLICK KITTY
   ========================= */

#kittyPanel {
  position: fixed;
  left: 18px;
  bottom: 82px;
  z-index: 2000;
}

#kittyButton {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;

  padding: 5px 8px;

  border: none;
  background: transparent;

  color: #fff5e6;

  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;

  box-shadow: none;
}

#kittyImage {
  width: 82px;
  height: 82px;
  object-fit: contain;

  filter:
    drop-shadow(
      0 3px 5px
      rgba(0,0,0,.55)
    );
}


/* =========================
   TIP POPUP
   ========================= */

#tipOverlay {
  position: fixed;
  inset: 0;
  z-index: 5000;

  justify-content: center;
  align-items: center;

    rgba(0,0,0,.72);
}

#tipBox {
  width: min(82vw,330px);

  padding: 28px 22px;

  text-align: center;

  color: #fff5e6;

  background:
    rgba(20,20,20,.96);

  border:
    2px solid #cf6537;

  border-radius: 24px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.55);
}

#tipThankYou {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 18px;
}

#tipFind {

  font-weight: bold;

  line-height: 1.35;
}

#tipOr {

#tipTransfer {

#emailButton {

#copiedMessage {

/* =========================

#countdownOverlay {

  flex-direction: column;
  justify-content: center;
  align-items: center;

#lookText {

@keyframes cameraFlashAnimation {

  }

  }

/* =========================================
   BUBBLES
   ========================================= */

function makeBubble() {

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  /* Bubble size */

  const size =
    28 +
    Math.random() * 42;

  bubble.style.width =
    size + "px";

  bubble.style.height =
    size + "px";


  /* Find mouth graphic */

  const mouth =
    document.getElementById(
      "mouthOverlay"
    );

  const cameraElement =
    document.querySelector(
      "a-camera"
    );


  if (
    !mouth ||
    !mouth.object3D ||
    !cameraElement
  ) {

    return;

  }


  const camera =
    cameraElement.getObject3D(
      "camera"
    );


  if (!camera) {
    return;
  }


  /* Cigarette tip */

  const tipPosition =
    new THREE.Vector3();


  tipPosition.set(
    0.72,
    -0.05,
    0
  );


  mouth.object3D.localToWorld(
    tipPosition
  );


  tipPosition.project(
    camera
  );


  const startX =
    (
      tipPosition.x *
      .5 +
      .5
    ) *
    window.innerWidth;


  const startY =
    (
      -tipPosition.y *
      .5 +
      .5
    ) *
    window.innerHeight;


  bubble.style.left =
    startX + "px";

  bubble.style.top =
    startY + "px";


  /* Movement */

  const drift =
    35 +
    Math.random() * 100;


  const rise =
    -(
      100 +
      Math.random() * 190
    );


  bubble.style.setProperty(
    "--drift",
    drift + "px"
  );


  bubble.style.setProperty(
    "--rise",
    rise + "px"
  );


  bubbleLayer.appendChild(
    bubble
  );


  /* Random pop */

  const willPop =
    Math.random() < .65;


  if (willPop) {

    const popTime =
      900 +
      Math.random() * 1600;


    setTimeout(
      () => {

        if (
          !bubble.isConnected
        ) {
          return;
        }


        const rect =
          bubble
            .getBoundingClientRect();


        const ring =
          document.createElement(
            "div"
          );


        ring.className =
          "pop-ring";


        ring.style.width =
          rect.width + "px";

        ring.style.height =
          rect.height + "px";

        ring.style.left =
          rect.left + "px";

        ring.style.top =
          rect.top + "px";


        bubbleLayer.appendChild(
          ring
        );


        bubble.style.animation =
          "none";


        bubble.animate(

          [
            {
              transform:
                "scale(1)",

              opacity: 1
            },

            {
              transform:
                "scale(1.18)",

              opacity: 0
            }
          ],

          {
            duration: 100,
            easing: "ease-out",
            fill: "forwards"
          }

        );


        setTimeout(
          () => {

            bubble.remove();

          },
          110
        );


        setTimeout(
          () => {

            ring.remove();

          },
          240
        );

      },
      popTime
    );

  }


  setTimeout(
    () => {

      if (
        bubble.isConnected
      ) {

        bubble.remove();

      }

    },
    3300
  );

}


/* Bubble button */

document
  .getElementById(
    "bubbleButton"
  )
  .addEventListener(
    "click",
    () => {

      for (
        let i = 0;
        i < 6;
        i++

/* =========================================

   ========================================= */

function wait(ms) {

  return new Promise(
    resolve => {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


/* =========================================
   PHOTO BUTTON
   ========================================= */

photoButton.addEventListener(
  "click",
  async () => {

    countdownOverlay.style.display =
      "flex";


    countdownNumber.textContent =
      "3";

    await wait(800);


    countdownNumber.textContent =
      "2";

    await wait(800);


    countdownNumber.textContent =
      "1";

    await wait(800);


    countdownOverlay.style.display =

    cameraFlash.classList.remove(

    void cameraFlash.offsetWidth;


    cameraFlash.classList.add(

    try {

      alert(

/* =========================================
   LIGHTWEIGHT ILLUSTRATION FILTER

   This only affects the SAVED selfie.
   It does NOT affect the live camera.
   ========================================= */

function comicIllustrationFilter(
  sourceCanvas
) {

  /*
    Make a smaller copy.

    Maximum width of 700 pixels keeps
    processing light on a phone.
  */

  const maxWidth =
    700;


  const scale =
    Math.min(
      1,
      maxWidth /
      sourceCanvas.width
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        sourceCanvas.width *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        sourceCanvas.height *
        scale
      )
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
    Illustration-style colour treatment.

    This is deliberately much lighter
    than the old pixel-by-pixel filter.
  */

  ctx.filter =
    "contrast(1.28) saturate(1.15) brightness(1.06) sepia(0.12)";


  ctx.drawImage(
    sourceCanvas,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.filter =
    "none";


  /*
    Warm cream/copper wash.
  */

  ctx.fillStyle =
    "rgba(207,101,55,0.055)";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Fine grain.
  */

  ctx.save();

  ctx.globalAlpha =
    .05;


  for (
    let i = 0;
    i < 300;
    i++
  ) {

    const x =
      Math.random() *
      canvas.width;


    const y =
      Math.random() *
      canvas.height;


    const grainSize =
      .5 +
      Math.random() *
      1.5;


    ctx.fillStyle =
      Math.random() > .5
        ? "#111111"
        : "#fff0d2";


    ctx.fillRect(
      x,
      y,
      grainSize,
      grainSize
    );

  }


  ctx.restore();


  return canvas;

}


/* =========================================
   CREATE POLAROID
   ========================================= */

async function createPolaroid() {

  const outputSize =
    1400;


  const outputCanvas =
    document.createElement(
      "canvas"
    );


  outputCanvas.width =
    outputSize;

  outputCanvas.height =
    outputSize;


  const ctx =
    outputCanvas.getContext(
      "2d"
    );


  /* =========================
     POLAROID PHOTO OPENING
     ========================= */

  const photoX =
    outputSize * .105;

  const photoY =
    outputSize * .055;

  const photoW =
    outputSize * .79;

  const photoH =
    outputSize * .69;


  /* =========================
     GET LIVE CAMERA
     ========================= */

  const video =
    document.querySelector(
      "video"
    );


  if (
    !video ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    alert(
      "Camera is still loading. Try again."
    );

    return;

  }


  /*
    Keep the capture canvas at a
    reasonable resolution.

    This is enough for the Polaroid
    without creating a huge phone canvas.
  */

  const captureScale =
    Math.min(
      2,
      window.devicePixelRatio || 1
    );


  const screenCanvas =
    document.createElement(
      "canvas"
    );


  screenCanvas.width =
    Math.round(
      window.innerWidth *
      captureScale
    );


  screenCanvas.height =
    Math.round(
      window.innerHeight *
      captureScale
    );


  const screenCtx =
    screenCanvas.getContext(
      "2d"
    );


  const sw =
    screenCanvas.width;

  const sh =
    screenCanvas.height;


  /* =========================
     CAMERA CROP
     ========================= */

  const videoRatio =
    video.videoWidth /
    video.videoHeight;


  const screenRatio =
    sw / sh;


  let sx = 0;
  let sy = 0;

  let sWidth =
    video.videoWidth;

  let sHeight =
    video.videoHeight;


  if (
    videoRatio >
    screenRatio
  ) {

    sWidth =
      video.videoHeight *
      screenRatio;


    sx =
      (
        video.videoWidth -
        sWidth
      ) / 2;

  }

  else {

    sHeight =
      video.videoWidth /
      screenRatio;


    sy =
      (
        video.videoHeight -
        sHeight
      ) / 2;

  }


  /* =========================
     DRAW CAMERA
     ========================= */

  screenCtx.save();


  /*
    Front camera selfie mirror.
  */

  screenCtx.translate(
    sw,
    0
  );


  screenCtx.scale(
    -1,
    1
  );


  screenCtx.drawImage(

    video,

    sx,
    sy,
    sWidth,
    sHeight,

    0,
    0,
    sw,
    sh

  );


  screenCtx.restore();


  /* =========================
     DRAW LIVE AR FILTER
     ========================= */

  const aframeCanvas =
    scene.canvas;


  if (aframeCanvas) {

    if (
      scene.renderer &&
      scene.object3D &&
      scene.camera
    ) {

      scene.renderer.render(
        scene.object3D,
        scene.camera
      );

    }


    screenCtx.drawImage(

      aframeCanvas,

      0,
      0,
      aframeCanvas.width,
      aframeCanvas.height,

      0,
      0,
      sw,
      sh

    );

  }


  /* =========================
     MAKE ILLUSTRATED COPY
     ========================= */

  const illustratedSelfie =
    comicIllustrationFilter(
      screenCanvas
    );


  const illustratedW =
    illustratedSelfie.width;


  const illustratedH =
    illustratedSelfie.height;


  /* =========================
     CROP FOR POLAROID
     ========================= */

  const compositeRatio =
    illustratedW /
    illustratedH;


  const targetRatio =
    photoW /
    photoH;


  let csx = 0;
  let csy = 0;

  let csw =
    illustratedW;

  let csh =
    illustratedH;


  if (
    compositeRatio >
    targetRatio
  ) {

    csw =
      illustratedH *
      targetRatio;


    csx =
      (
        illustratedW -
        csw
      ) / 2;

  }

  else {

    csh =
      illustratedW /
      targetRatio;


    csy =
      (
        illustratedH -
        csh
      ) / 2;

  }


  /* =========================
     DRAW SELFIE
     ========================= */

  ctx.save();


  ctx.beginPath();


  ctx.rect(
    photoX,
    photoY,
    photoW,
    photoH
  );


  ctx.clip();


  ctx.drawImage(

    illustratedSelfie,

    csx,
    csy,
    csw,
    csh,

    photoX,
    photoY,
    photoW,
    photoH

  );


  ctx.restore();


  /* =========================
     DRAW POLAROID + BAND
     ========================= */

  const polaroid =
    document.getElementById(
      "polaroidGraphic"
    );


  /*
    Wait for image if necessary.
  */

  if (
    !polaroid.complete ||
    !polaroid.naturalWidth
  ) {

    await new Promise(
      (resolve,reject) => {

        polaroid.onload =
          resolve;

        polaroid.onerror =
          reject;

      }
    );

  }


  ctx.drawImage(
    polaroid,
    0,
    0,
    outputSize,
    outputSize
  );


  /* =========================
     CURRENT DATE
     ========================= */

  const today =
    new Date();


  const dateText =

    String(
      today.getMonth() + 1
    ).padStart(
      2,
      "0"
    )

    +

    "/"

    +

    String(
      today.getDate()
    ).padStart(
      2,
      "0"
    )

    +

    "/"

    +

    String(
      today.getFullYear()
    ).slice(-2);


  ctx.save();


  ctx.fillStyle =
    "#111";


  ctx.font =
    "bold 30px Arial";


  ctx.textAlign =
    "left";


  ctx.textBaseline =
    "middle";


  ctx.fillText(

    dateText,

    outputSize * .817,

    outputSize * .885

  );


  ctx.restore();


  /* =========================
     FINISHED PHOTO
     ========================= */

  finishedPhotoURL =
    outputCanvas.toDataURL(
      "image/png"
    );


  finishedPhoto.src =
    finishedPhotoURL;


  photoResult.style.display =
    "flex";

}


/* =========================================
   RETAKE
   ========================================= */

retakeButton.addEventListener(
  "click",
  () => {

    photoResult.style.display =
      "none";


    finishedPhoto.src =
      "";


    finishedPhotoURL =
      null;

  }
);


/* =========================================
   SAVE PHOTO
   ========================================= */

savePhotoButton.addEventListener(
  "click",
  () => {

    if (
      !finishedPhotoURL
    ) {

      return;

    }


    const link =
      document.createElement(
        "a"
      );


    const today =
      new Date();


    const filename =

      "the-hook-" +

      today.getFullYear() +

      "-" +

      String(
        today.getMonth() + 1
      ).padStart(
        2,
        "0"
      )

      +

      "-" +

      String(
        today.getDate()
      ).padStart(
        2,
        "0"
      )

      +

      ".png";


    link.href =
      finishedPhotoURL;


    link.download =
      filename;


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();

  }
);


</script>

</body>
</html>
