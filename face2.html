<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

button {
  appearance: none;
  -webkit-appearance: none;
  border: 2px solid #fff5e6;
  background: #cf6537;
  color: #fff5e6;
  padding: 12px 17px;
  border-radius: 24px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
}

button:active {
  transform: scale(.96);
}


/* =========================
   TOP BUTTONS
   ========================= */

#backButton,
#cameraButton {
  position: fixed;
  top: 18px;
  z-index: 2000;
  background: rgba(0,0,0,.70);
}

#backButton {
  left: 16px;
  padding: 10px 14px;
  font-size: 13px;
}

#cameraButton {
  right: 16px;
  padding: 10px 14px;
  font-size: 18px;
}


/* =========================
   BOTTOM BUTTONS
   ========================= */

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 25px;
  z-index: 2000;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}


/* =========================
   BUBBLES
   ========================= */

#bubbleLayer {
  position: fixed;
  inset: 0;
  z-index: 800;
  overflow: hidden;
  pointer-events: none;
}

.bubble {
  position: absolute;
  border-radius: 50%;

  border:
    1.5px solid
    rgba(255,255,255,.90);

  background:
    rgba(255,255,255,.10);

  box-shadow:
    inset 3px 3px 3px rgba(255,255,255,.38),
    0 0 4px rgba(255,255,255,.22);

  animation:
    floatBubble 3.2s ease-out forwards;
}

.pop-ring {
  position: fixed;
  border-radius: 50%;

  border:
    1.5px solid
    rgba(255,255,255,.9);

  background: transparent;

  pointer-events: none;
  z-index: 801;

  animation:
    bubblePopRing 220ms ease-out forwards;
}

@keyframes floatBubble {

  0% {
    opacity: 0;
    transform:
      translate(0,0)
      scale(.35);
  }

  12% {
    opacity: 1;
  }

  100% {
    opacity: 0;

    transform:
      translate(
        var(--drift),
        var(--rise)
      )
      scale(1.35);
  }
}

@keyframes bubblePopRing {

  0% {
    opacity: 1;
    transform: scale(.7);
  }

  60% {
    opacity: .8;
  }

  100% {
    opacity: 0;
    transform: scale(1.45);
  }
}


/* =========================
   CLICK KITTY
   ========================= */

#kittyPanel {
  position: fixed;
  left: 18px;
  bottom: 82px;
  z-index: 2000;
}

#kittyButton {

  flex-direction: column;
  align-items: center;
  gap: 3px;

  padding: 5px 8px;

  border: none;
  background: transparent;

  color: #fff5e6;

  font-weight: bold;
  letter-spacing: 1px;

  box-shadow: none;

#kittyImage {

  height: 82px;
  object-fit: contain;

  filter:
    drop-shadow(
      0 3px 5px
      rgba(0,0,0,.55)
    );
}


/* =========================
   TIP POPUP
   ========================= */

#tipOverlay {

  inset: 0;
  z-index: 5000;

    rgba(0,0,0,.72);

#tipBox {

  text-align: center;

  color: #fff5e6;

  background:
    rgba(20,20,20,.96);

  border:
    2px solid #cf6537;

  border-radius: 24px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.55);
}

#tipThankYou {

}

#tipFind {

/* =========================

#countdownOverlay {

  z-index: 8000;

  flex-direction: column;
  justify-content: center;

#lookText {

#cameraFlash.flash {

@keyframes cameraFlashAnimation {

  }

  100% {
    opacity: 0;
  }
}


/* A-FRAME FULL SCREEN */

a-scene {

function makeBubble() {

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  /* Bubble size */

  const size =
    28 +
    Math.random() * 42;

  bubble.style.width =
    size + "px";

  bubble.style.height =
    size + "px";


  /* Find mouth graphic */

  const mouth =
    document.getElementById(
      "mouthOverlay"
    );

  const cameraElement =
    document.querySelector(
      "a-camera"
    );


  if (
    !mouth ||
    !mouth.object3D ||
    !cameraElement
  ) {

    return;

  }


  const camera =
    cameraElement.getObject3D(
      "camera"
    );


  if (!camera) {
    return;
  }


  /* Cigarette tip */

  const tipPosition =
    new THREE.Vector3();


  tipPosition.set(
    0.72,
    -0.05,
    0
  );


  mouth.object3D.localToWorld(
    tipPosition
  );


  tipPosition.project(
    camera
  );


  const startX =
    (
      tipPosition.x *
      .5 +
      .5
    ) *
    window.innerWidth;


  const startY =
    (
      -tipPosition.y *
      .5 +
      .5
    ) *
    window.innerHeight;


  bubble.style.left =
    startX + "px";

  bubble.style.top =
    startY + "px";


  /* Movement */

  const drift =
    35 +
    Math.random() * 100;


  const rise =
    -(
      100 +
      Math.random() * 190
    );


  bubble.style.setProperty(
    "--drift",
    drift + "px"
  );


  bubble.style.setProperty(
    "--rise",
    rise + "px"
  );


  bubbleLayer.appendChild(
    bubble
  );


  /* Random pop */

  const willPop =
    Math.random() < .65;


  if (willPop) {

    const popTime =
      900 +
      Math.random() * 1600;


    setTimeout(
      () => {

        if (
          !bubble.isConnected
        ) {
          return;
        }


        const rect =
          bubble
            .getBoundingClientRect();


        const ring =
          document.createElement(
            "div"
          );


        ring.className =
          "pop-ring";


        ring.style.width =
          rect.width + "px";

        ring.style.height =
          rect.height + "px";

        ring.style.left =
          rect.left + "px";

        ring.style.top =
          rect.top + "px";


        bubbleLayer.appendChild(
          ring
        );


        bubble.style.animation =
          "none";


        bubble.animate(

          [
            {
              transform:
                "scale(1)",

              opacity: 1
            },

            {
              transform:
                "scale(1.18)",

              opacity: 0
            }
          ],

          {
            duration: 100,
            easing: "ease-out",
            fill: "forwards"
          }

        );


        setTimeout(
          () => {

            bubble.remove();

          },
          110
        );


        setTimeout(
          () => {

            ring.remove();

          },
          240
        );

      },
      popTime
    );

  }


  setTimeout(
    () => {

      if (
        bubble.isConnected
      ) {

        bubble.remove();

      }

    },
    3300
  );

}

function comicIllustrationFilter(sourceCanvas) {

  /*
    LOCAL ILLUSTRATION FILTER
    -------------------------
    Nothing is uploaded.
    No API.
    No charges.

    We deliberately process a smaller copy so this
    remains reasonable on an iPhone.
  */

  const MAX_WIDTH = 650;

  const scale = Math.min(
    1,
    MAX_WIDTH / sourceCanvas.width
  );

  const canvas =
    document.createElement("canvas");

  canvas.width = Math.max(
    1,
    Math.round(sourceCanvas.width * scale)
  );

  canvas.height = Math.max(
    1,
    Math.round(sourceCanvas.height * scale)
  );

  const ctx =
    canvas.getContext(
      "2d",
      { willReadFrequently: true }
    );

  const w = canvas.width;
  const h = canvas.height;


  /* =========================================
     1. MAKE A SOFTER SOURCE COPY

     Slight blur removes tiny photographic
     details before we flatten the colours.
     ========================================= */

  ctx.save();

  ctx.filter =
    "blur(0.7px) contrast(1.12) saturate(0.90)";

  ctx.drawImage(
    sourceCanvas,
    0,
    0,
    w,
    h
  );

  ctx.restore();


  /* =========================================
     2. FLATTEN INTO ILLUSTRATED COLOURS
     ========================================= */

  const image =
    ctx.getImageData(
      0,
      0,
      w,
      h
    );

  const data =
    image.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    let r = data[i];
    let g = data[i + 1];
    let b = data[i + 2];


    /* Brightness */

    const light =
      (
        r * 0.299 +
        g * 0.587 +
        b * 0.114
      );


    /*
      Posterize into broad tonal bands.

      We preserve some original colour so skin,
      hair and clothing are still recognizable.
    */

    let level;

    if (light < 48) {
      level = 28;
    }

    else if (light < 90) {
      level = 70;
    }

    else if (light < 135) {
      level = 115;
    }

    else if (light < 180) {
      level = 165;
    }

    else if (light < 220) {
      level = 210;
    }

    else {
      level = 242;
    }


    /*
      Blend flattened tone with original colour.
    */

    r =
      r * 0.48 +
      level * 0.52;

    g =
      g * 0.45 +
      level * 0.55;

    b =
      b * 0.42 +
      level * 0.58;


    /*
      Warm cream/copper treatment.

      This pushes the selfie toward the palette
      of your illustrated band artwork.
    */

    r += 15;
    g += 4;
    b -= 9;


    /*
      Posterize each colour channel.
    */

    const step = 34;

    r =
      Math.round(r / step) * step;

    g =
      Math.round(g / step) * step;

    b =
      Math.round(b / step) * step;


    data[i] =
      Math.max(
        0,
        Math.min(255, r)
      );

    data[i + 1] =
      Math.max(
        0,
        Math.min(255, g)
      );

    data[i + 2] =
      Math.max(
        0,
        Math.min(255, b)
      );

  }


  ctx.putImageData(
    image,
    0,
    0
  );


  /* =========================================
     3. CREATE INK OUTLINES

     We calculate edges on a SMALLER copy.
     This is considerably lighter than doing
     edge detection at the phone's full
     screen resolution.
     ========================================= */

  const edgeScale = 0.5;

  const ew =
    Math.max(
      1,
      Math.round(w * edgeScale)
    );

  const eh =
    Math.max(
      1,
      Math.round(h * edgeScale)
    );


  const edgeSource =
    document.createElement("canvas");

  edgeSource.width = ew;
  edgeSource.height = eh;


  const edgeSourceCtx =
    edgeSource.getContext(
      "2d",
      { willReadFrequently: true }
    );


  edgeSourceCtx.drawImage(
    canvas,
    0,
    0,
    ew,
    eh
  );


  const edgeData =
    edgeSourceCtx.getImageData(
      0,
      0,
      ew,
      eh
    );

  const src =
    edgeData.data;


  const edgeCanvas =
    document.createElement("canvas");

  edgeCanvas.width = ew;
  edgeCanvas.height = eh;


  const edgeCtx =
    edgeCanvas.getContext("2d");


  const output =
    edgeCtx.createImageData(
      ew,
      eh
    );

  const out =
    output.data;


  for (
    let y = 1;
    y < eh - 1;
    y++
  ) {

    for (
      let x = 1;
      x < ew - 1;
      x++
    ) {

      const p =
        (y * ew + x) * 4;

      const right =
        (y * ew + x + 1) * 4;

      const down =
        ((y + 1) * ew + x) * 4;


      const lum =
        src[p] * 0.299 +
        src[p + 1] * 0.587 +
        src[p + 2] * 0.114;


      const lumRight =
        src[right] * 0.299 +
        src[right + 1] * 0.587 +
        src[right + 2] * 0.114;


      const lumDown =
        src[down] * 0.299 +
        src[down + 1] * 0.587 +
        src[down + 2] * 0.114;


      const edge =
        Math.abs(
          lum - lumRight
        )
        +
        Math.abs(
          lum - lumDown
        );


      /*
        Higher threshold prevents every skin
        detail from becoming a black line.
      */

      if (edge > 37) {

        const strength =
          Math.min(
            185,
            (edge - 37) * 4
          );


        out[p] = 17;
        out[p + 1] = 14;
        out[p + 2] = 12;

        out[p + 3] =
          strength;

      }

      else {

        out[p + 3] = 0;

      }

    }

  }


  edgeCtx.putImageData(
    output,
    0,
    0
  );


  /*
    Enlarge the ink drawing over the portrait.

    imageSmoothingEnabled=false makes the lines
    slightly rougher and more screen-print-like.
  */

  ctx.save();

  ctx.imageSmoothingEnabled =
    false;

  ctx.globalAlpha =
    0.88;

  ctx.drawImage(
    edgeCanvas,
    0,
    0,
    ew,
    eh,
    0,
    0,
    w,
    h
  );

  ctx.restore();


  /* =========================================
     4. CREAM HIGHLIGHT WASH
     ========================================= */

  ctx.save();

  ctx.globalCompositeOperation =
    "screen";

  ctx.fillStyle =
    "rgba(255,235,205,0.055)";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );

  ctx.restore();


  /* =========================================
     5. PRINT TEXTURE

     Very restrained so the person's face
     doesn't become speckled.
     ========================================= */

  ctx.save();

  ctx.globalAlpha =
    0.065;


  const grainCount =
    Math.round(
      (w * h) / 1800
    );


  for (
    let i = 0;
    i < grainCount;
    i++
  ) {

    const x =
      Math.random() * w;

    const y =
      Math.random() * h;


    const dot =
      0.7 +
      Math.random() * 1.2;


    ctx.fillStyle =
      Math.random() > 0.60
        ? "#17130f"
        : "#f2d8b4";


    ctx.fillRect(
      x,
      y,
      dot,
      dot
    );

  }


  ctx.restore();


  /* =========================================
     6. FINAL CONTRAST PASS
     ========================================= */

  const finished =
    document.createElement("canvas");

  finished.width = w;
  finished.height = h;


  const finishedCtx =
    finished.getContext("2d");


  finishedCtx.filter =
    "contrast(1.10) saturate(1.04)";


  finishedCtx.drawImage(
    canvas,
    0,
    0
  );


  finishedCtx.filter =
    "none";


  return finished;
}


/* =========================================
   CREATE POLAROID
   ========================================= */

async function createPolaroid() {

  const outputSize =
    1400;


  const outputCanvas =
    document.createElement(
      "canvas"
    );


  outputCanvas.width =
    outputSize;

  outputCanvas.height =
    outputSize;


  const ctx =
    outputCanvas.getContext(
      "2d"
    );


/* =========================================
   SELFIE AREA FOR BUBBLES AMP FRAME
   ========================================= */

const photoX =
  outputSize * 0.075;

const photoY =
  outputSize * 0.075;

const photoW =
  outputSize * 0.85;

const photoH =
  outputSize * 0.72;


  /* =========================
     GET LIVE CAMERA
     ========================= */

  const video =
    document.querySelector(
      "video"
    );


  if (
    !video ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    alert(
      "Camera is still loading. Try again."
    );

    return;

  }


  /*
    Keep the capture canvas at a
    reasonable resolution.

    This is enough for the Polaroid
    without creating a huge phone canvas.
  */

  const captureScale =
    Math.min(
      2,
      window.devicePixelRatio || 1
    );


  const screenCanvas =
    document.createElement(
      "canvas"
    );


  screenCanvas.width =
    Math.round(
      window.innerWidth *
      captureScale
    );


  screenCanvas.height =
    Math.round(
      window.innerHeight *
      captureScale
    );


  const screenCtx =
    screenCanvas.getContext(
      "2d"
    );


  const sw =
    screenCanvas.width;

  const sh =
    screenCanvas.height;


  /* =========================
     CAMERA CROP
     ========================= */

  const videoRatio =
    video.videoWidth /
    video.videoHeight;


  const screenRatio =
    sw / sh;


  let sx = 0;
  let sy = 0;

  let sWidth =
    video.videoWidth;

  let sHeight =
    video.videoHeight;


  if (
    videoRatio >
    screenRatio
  ) {

    sWidth =
      video.videoHeight *
      screenRatio;


    sx =
      (
        video.videoWidth -
        sWidth
      ) / 2;

  }

  else {

    sHeight =
      video.videoWidth /
      screenRatio;


    sy =
      (
        video.videoHeight -
        sHeight
      ) / 2;

  }


  /* =========================
     DRAW CAMERA
     ========================= */

  screenCtx.save();


  /*
    Front camera selfie mirror.
  */

  screenCtx.translate(
    sw,
    0
  );


  screenCtx.scale(
    -1,
    1
  );


  screenCtx.drawImage(

    video,

    sx,
    sy,
    sWidth,
    sHeight,

    0,
    0,
    sw,
    sh

  );


  screenCtx.restore();


 


  /* =========================
     MAKE ILLUSTRATED COPY
     ========================= */

 

  const illustratedW =
    screenCanvas.width;


  const illustratedH =
    screenCanvas.height;


  /* =========================
     CROP FOR POLAROID
     ========================= */

  const compositeRatio =
    illustratedW /
    illustratedH;


  const targetRatio =
    photoW /
    photoH;


  let csx = 0;
  let csy = 0;

  let csw =
    illustratedW;

  let csh =
    illustratedH;


  if (
    compositeRatio >
    targetRatio
  ) {

    csw =
      illustratedH *
      targetRatio;


    csx =
      (
        illustratedW -
        csw
      ) / 2;

  }

  else {

    csh =
      illustratedW /
      targetRatio;


    csy =
      (
        illustratedH -
        csh
      ) / 2;

  }


/* =========================
   DRAW SELFIE - ZOOMED OUT
   ========================= */

ctx.save();

ctx.beginPath();

ctx.rect(
  photoX,
  photoY,
  photoW,
  photoH
);

ctx.clip();


/*
  SCALE THE SELFIE DOWN INSIDE THE POLAROID

  0.78 = 78% of the old size.

  Smaller number = MORE of you visible
  Larger number = closer / more zoomed in
*/

const selfieScale = 0.78;


const drawW =
  photoW * selfieScale;

const drawH =
  photoH * selfieScale;


/*
  Centre the smaller selfie
*/

const drawX =
  photoX +
  (photoW - drawW) / 2;

const drawY =
  photoY +
  (photoH - drawH) / 2;


/*
  Fill behind it so reducing the selfie
  doesn't leave transparent areas.
*/

ctx.fillStyle = "#111";

ctx.fillRect(
  photoX,
  photoY,
  photoW,
  photoH
);


/*
  Draw the illustrated selfie smaller
*/

ctx.drawImage(

  screenCanvas,

  csx,
  csy,
  csw,
  csh,

  drawX,
  drawY,
  drawW,
  drawH

);

ctx.restore();


  /* =========================
     DRAW POLAROID + BAND
     ========================= */

  const polaroid =
    document.getElementById(
      "polaroidGraphic"
    );


  /*
    Wait for image if necessary.
  */

  if (
    !polaroid.complete ||
    !polaroid.naturalWidth
  ) {

    await new Promise(
      (resolve,reject) => {

        polaroid.onload =
          resolve;

        polaroid.onerror =
          reject;

      }
    );

  }


  ctx.drawImage(
    polaroid,
    0,
    0,
    outputSize,
    outputSize
  );


  /* =========================
     CURRENT DATE
     ========================= */

  const today =
    new Date();


  const dateText =

    String(
      today.getMonth() + 1
    ).padStart(
      2,
      "0"
    )

    +

    "/"

    +

    String(
      today.getDate()
    ).padStart(
      2,
      "0"
    )

    +

    "/"

    +

    String(
      today.getFullYear()
    ).slice(-2);


  ctx.save();


  ctx.fillStyle =
    "#111";


  ctx.font =
    "bold 30px Arial";


  ctx.textAlign =
    "left";


  ctx.textBaseline =
    "middle";


  ctx.fillText(

    dateText,

    outputSize * .817,

    outputSize * .885

  );


  ctx.restore();


  /* =========================
     FINISHED PHOTO
     ========================= */

  finishedPhotoURL =
    outputCanvas.toDataURL(
      "image/png"
    );


  finishedPhoto.src =
    finishedPhotoURL;


  photoResult.style.display =
    "flex";

}


/* =========================================
   RETAKE
   ========================================= */

retakeButton.addEventListener(
  "click",
  () => {

    photoResult.style.display =
      "none";


    finishedPhoto.src =
      "";


    finishedPhotoURL =
      null;

  }
);


/* =========================================
   SAVE PHOTO
   ========================================= */

savePhotoButton.addEventListener(
  "click",
  () => {

    if (
      !finishedPhotoURL
    ) {

      return;

    }


    const link =
      document.createElement(
        "a"
      );


    const today =
      new Date();


    const filename =

      "the-hook-" +

      today.getFullYear() +

      "-" +

      String(
        today.getMonth() + 1
      ).padStart(
        2,
        "0"
      )

      +

      "-" +

      String(
        today.getDate()
      ).padStart(
        2,
        "0"
      )

      +

      ".png";


    link.href =
      finishedPhotoURL;


    link.download =
      filename;


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();

  }
);


</script>
