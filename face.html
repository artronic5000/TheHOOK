      left: 18px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #switchCamera {

      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #instruction {

      position: fixed;

      bottom: 22px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 99999;

      padding: 8px 14px;

      border-radius: 18px;

      background:
        rgba(0,0,0,0.45);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 11px;

      letter-spacing: 1px;

      white-space: nowrap;

    }

  </style>

</head>

<button

<button

<script>


  document.addEventListener(

    "DOMContentLoaded",

    function () {


      const scene =
        document.getElementById(
          "faceScene"
        );


      const backButton =
        document.getElementById(
          "backButton"
        );


      const switchButton =
        document.getElementById(
          "switchCamera"
        );


      let arSystem =
        null;



      backButton.addEventListener(

        "click",

        function () {

          window.location.href =
            "./index.html";

        }

      );



      scene.addEventListener(

        "loaded",

        function () {

          arSystem =
            scene.systems[
              "mindar-face-system"
            ];

        }

      );



      switchButton.addEventListener(

        "click",

        async function () {


          if (!arSystem) {

            arSystem =
              scene.systems[
                "mindar-face-system"
              ];

          }


          if (

            arSystem &&

            typeof arSystem.switchCamera
              === "function"

          ) {


            try {

              await arSystem
                .switchCamera();

            }


            catch (error) {

              console.log(
                "Camera switch error:",
                error
              );

            }


          }


        }

      );


    }

  );


</script>
