<!DOCTYPE html>
<html>

    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    #backButton {

      position: fixed;

      top: 18px;
      left: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #switchCamera {

      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    /* =====================================================
       CLICK KITTY BANNER
       ===================================================== */

    #clickKittyBanner {

      position: fixed;

      right: 14px;
      bottom: 205px;

      width: 105px;

      z-index: 100001;

      padding: 6px 5px;

      box-sizing: border-box;

      border-radius: 12px;

      background:
        rgba(0,0,0,0.72);

      color:
        #f6b93b;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 1px;

      text-align: center;

      pointer-events: none;

      animation:
        kittyBannerPulse
        1.8s
        ease-in-out
        infinite;

    }


    @keyframes kittyBannerPulse {

      0%,
      100% {

        transform:
          scale(1);

        text-shadow:
          0 0 3px
          rgba(246,185,59,0.5);

      }


      50% {

        transform:
          scale(1.08);

        text-shadow:
          0 0 10px
          rgba(246,185,59,1);

      }

    }



    /* =====================================================
       ANIMATED KITTY TIP BUTTON
       ===================================================== */

    #tipButton {

      position: fixed;

      right: 14px;
      bottom: 58px;

      width: 105px;
      height: 145px;

      z-index: 100000;

      border: none;

      padding: 0;

      background:
        transparent;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    #tipButton img {

      width: 100%;
      height: 100%;

      object-fit:
        contain;

      display:
        block;

      filter:
        drop-shadow(
          0 4px 7px
          rgba(0,0,0,0.45)
        );

    }


    #tipButton:active {

      transform:
        scale(0.94);

    }



    /* =====================================================
       TIP OVERLAY
       ===================================================== */

    #tipOverlay {

      display: none;

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 200000;

      background:
        rgba(0,0,0,0.88);

      align-items:
        center;

      justify-content:
        center;

      padding:
        18px;

      box-sizing:
        border-box;

    }



    /* =====================================================
       TIP PANEL
       ===================================================== */

    #tipPanel {

      width:
        min(
          90%,
          390px
        );

      padding:
        30px
        18px
        26px
        18px;

      box-sizing:
        border-box;

      background:
        #050505;

      border-radius:
        20px;

      text-align:
        center;

      color:
        white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      box-shadow:
        0 8px 40px
        rgba(0,0,0,0.65);

    }



    #tipPanel h1 {

      margin:
        0 0 6px 0;

      color:
        #f6b93b;

      font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size:
        56px;

      font-weight:
        normal;

      line-height:
        0.95;

      transform:
        rotate(-2deg);

      text-shadow:
        0 2px 6px
        rgba(246,185,59,0.18);

    }



    .tipHeart {

      margin:
        6px 0 8px 0;

      color:
        #f6b93b;

      font-size:
        28px;

      line-height:
        1;

    }



    .findKitty {

      position:
        relative;

      display:
        inline-block;

      color:
        #f7d36c;

      font-size:
        19px;

      font-weight:
        900;

      letter-spacing:
        1px;

      line-height:
        1.25;

    }


    .findKitty::before {

      content:
        "✦";

      position:
        absolute;

      left:
        -34px;

      top:
        14px;

      color:
        #f6b93b;

      font-size:
        18px;

    }


    .findKitty::after {

      content:
        "✦";

      position:
        absolute;

      right:
        -34px;

      top:
        14px;

      color:
        #f6b93b;

      font-size:
        18px;

    }



    .or {

      margin:
        6px 0 4px 0;

      color:
        #f6b93b;

      font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size:
        27px;

      font-style:
        italic;

    }



    .transferTitle {

      margin-bottom:

      color:
        #f7d36c;

      font-size:
        19px;

      font-weight:
        900;

      letter-spacing:
        1px;

      letter-spacing:

      color:

      font-size:

        #f6d675;

        from: 0.42 0.42 0.42;
        to: 1.45 1.45 1.45;
        dur: 2600;
        delay: 2750;
        loop: true;
      "
    >

      <a-ring
        radius-inner="0.025"
        radius-outer="0.041"

        material="
          shader: flat;
          color: #fff0c7;
          transparent: true;
          opacity: 0.70;
          side: double;
          depthTest: false;
          depthWrite: false;
        "
      ></a-ring>


      <a-circle
        position="-0.015 0.019 0.01"
        radius="0.007"

        material="
          shader: flat;
          color: white;
          transparent: true;
          opacity: 0.95;
          depthTest: false;
          depthWrite: false;
        "
      ></a-circle>

    </a-entity>


  </a-entity>


</a-scene>



<script>


  document.addEventListener(

    "DOMContentLoaded",

    function () {


      const scene =
        document.getElementById(
          "faceScene"
        );


      const backButton =
        document.getElementById(
          "backButton"
        );


      const switchButton =
        document.getElementById(
          "switchCamera"
        );


      let arSystem =
        null;



      backButton.addEventListener(

        "click",

        function () {

          window.location.href =
            "./index.html";

        }

      );



      scene.addEventListener(

        "loaded",

        function () {

          arSystem =
            scene.systems[
              "mindar-face-system"
            ];

        }

      );



      switchButton.addEventListener(

        "click",

        async function () {


          if (!arSystem) {

            arSystem =
              scene.systems[
                "mindar-face-system"
              ];

          }


          if (

            arSystem &&

            typeof arSystem.switchCamera
              === "function"

          ) {


            try {

              await arSystem
                .switchCamera();

            }


            catch (error) {

              console.log(
                "Camera switch error:",
                error
              );

            }


          }


        }

      );



      /* =====================================================
         KITTY TIP ELEMENTS
         ===================================================== */

      const tipButton =
        document.getElementById(
          "tipButton"
        );


      const tipAnimation =
        document.getElementById(
          "tipAnimation"
        );


      const tipOverlay =
        document.getElementById(
          "tipOverlay"
        );


      const copyEmail =
        document.getElementById(
          "copyEmail"
        );


      const copyMessage =
        document.getElementById(
          "copyMessage"
        );


      const closeTip =
        document.getElementById(
          "closeTip"
        );



      /* =====================================================
         TIP IMAGE FRAMES
         ===================================================== */

      const tipFrames = [

        "./tip1.png",

        "./tip2.png",

        "./tip3.png",

        "./tip4.png",

        "./tip5.png"

      ];



      /* PRELOAD TIP IMAGES */

      tipFrames.forEach(

        function (src) {

          const img =
            new Image();

          img.src =
            src;

        }

      );



      function wait(
        milliseconds
      ) {

        return new Promise(

          function (resolve) {

            setTimeout(
              resolve,
              milliseconds
            );

          }

        );

      }



      /* =====================================================
         TIP ANIMATION
         ===================================================== */

      async function playTipAnimation() {


        tipAnimation.src =
          tipFrames[0];


        await wait(
          350
        );


        tipAnimation.src =
          tipFrames[1];


        await wait(
          350
        );


        tipAnimation.src =
          tipFrames[2];


        await wait(
          420
        );


        tipAnimation.src =
          tipFrames[3];


        await wait(
          420
        );


        tipAnimation.src =
          tipFrames[4];


        await wait(
          500
        );


        tipAnimation.src =
          tipFrames[0];


      }



      async function startTipLoop() {


        while (true) {


          await playTipAnimation();


          await wait(
            2500
          );


        }


      }



      startTipLoop();



      /* =====================================================
         OPEN TIP WINDOW
         ===================================================== */

      tipButton.addEventListener(

        "click",

        function () {

          tipOverlay.style.display =
            "flex";

        }

      );



      /* =====================================================
         COPY E-TRANSFER EMAIL
         ===================================================== */

      copyEmail.addEventListener(

        "click",

        async function () {


          const email =
            "thehooksechelt@gmail.com";


          try {


            await navigator.clipboard
              .writeText(
                email
              );


            copyMessage.textContent =
              "EMAIL COPIED ✓";


          }


          catch (error) {


            const textArea =
              document.createElement(
                "textarea"
              );


            textArea.value =
              email;


            textArea.style.position =
              "fixed";


            textArea.style.opacity =
              "0";


            document.body.appendChild(
              textArea
            );


            textArea.focus();


            textArea.select();


            try {


              document.execCommand(
                "copy"
              );


              copyMessage.textContent =
                "EMAIL COPIED ✓";


            }


            catch (copyError) {


              copyMessage.textContent =
                "COPY: " + email;


            }


            document.body.removeChild(
              textArea
            );


          }


        }

      );



      /* =====================================================
         CLOSE TIP WINDOW
         ===================================================== */

      closeTip.addEventListener(

        "click",

        function () {


          tipOverlay.style.display =
            "none";


          copyMessage.textContent =
            "TAP EMAIL TO COPY";


        }

      );



      /* =====================================================
         TAP DARK AREA TO CLOSE
         ===================================================== */

      tipOverlay.addEventListener(

        "click",

        function (event) {


          if (

            event.target ===
            tipOverlay

          ) {


            tipOverlay.style.display =
              "none";


            copyMessage.textContent =
              "TAP EMAIL TO COPY";


          }


        }

      );


    }

  );


</script>


</body>

</html>
