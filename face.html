<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR FACE -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    #backButton {

      position: fixed;

      top: 18px;
      left: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #switchCamera {

      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #instruction {

      position: fixed;

      bottom: 22px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 99999;

      padding: 8px 14px;

      border-radius: 18px;

      background:
        rgba(0,0,0,0.45);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 11px;

      letter-spacing: 1px;

      white-space: nowrap;

    }

  </style>


  <script>


    /* ==========================================================
       PIPE BUBBLE EMITTER

       Bubble origin is positioned at the PIPE BOWL.

       EDIT THESE TWO NUMBERS if needed:

       pipeX = left / right
       pipeY = up / down

       ========================================================== */


    AFRAME.registerComponent("pipe-bubbles", {


      init: function () {


        const target = this.el;


        let bubbleTimer = null;

        let running = false;



        /* ======================================================
           PIPE BOWL POSITION
           ====================================================== */


        const pipeX = 0.72;

        const pipeY = 0.20;

        const pipeZ = 0.18;



        /* ======================================================
           CREATE ONE BUBBLE
           ====================================================== */


        function createBubble() {


          if (!running) {
            return;
          }


          const bubble =
            document.createElement("a-ring");


          bubble.classList.add(
            "pipe-bubble"
          );



          /* RANDOM BUBBLE SIZE */

          const size =
            0.025 +
            Math.random() * 0.045;



          /* SMALL RANDOM START VARIATION */

          const startX =
            pipeX +
            (Math.random() - 0.5) * 0.035;


          const startY =
            pipeY +
            Math.random() * 0.025;



          /* RANDOM LEFT / RIGHT DRIFT */

          const drift =
            (Math.random() - 0.5) * 0.30;


          const endX =
            startX + drift;


          const rise =
            0.45 +
            Math.random() * 0.35;


          const endY =
            startY + rise;



          /* RANDOM SPEED */

          const duration =
            1800 +
            Math.random() * 1500;



          /* BUBBLE SHAPE */

          bubble.setAttribute(
            "radius-inner",
            size * 0.72
          );


          bubble.setAttribute(
            "radius-outer",
            size
          );



          bubble.setAttribute(

            "position",

            `${startX} ${startY} ${pipeZ}`

          );



          /* BUBBLE MATERIAL */

          bubble.setAttribute(

            "material",

            `
            shader: flat;
            color: #dffaff;
            transparent: true;
            opacity: 0.75;
            side: double;
            depthWrite: false;
            depthTest: false;
            `

          );



          /* RISE + DRIFT */

          bubble.setAttribute(

            "animation__move",

            `
            property: position;
            from: ${startX} ${startY} ${pipeZ};
            to: ${endX} ${endY} ${pipeZ};
            dur: ${duration};
            easing: easeOutQuad;
            `

          );



          /* GROW */

          bubble.setAttribute(

            "animation__grow",

            `
            property: scale;
            from: 0.65 0.65 0.65;
            to: 1.45 1.45 1.45;
            dur: ${duration};
            easing: easeOutQuad;
            `

          );



          /* FADE */

          bubble.setAttribute(

            "animation__fade",

            `
            property: material.opacity;
            from: 0.75;
            to: 0;
            dur: ${duration};
            easing: easeInQuad;
            `

          );



          target.appendChild(
            bubble
          );



          /* REMOVE AFTER ANIMATION */

          setTimeout(

            function () {


              if (
                bubble &&
                bubble.parentNode
              ) {

                bubble.parentNode
                  .removeChild(
                    bubble
                  );

              }


            },

            duration + 100

          );


        }



        /* ======================================================
           START BUBBLES
           ====================================================== */


        function startBubbles() {


          if (running) {
            return;
          }


          running = true;



          /* FIRST BUBBLE */

          createBubble();



          /* NEW BUBBLE EVERY ~350ms */

          bubbleTimer =
            setInterval(

              function () {


                createBubble();


              },

              350

            );


        }



        /* ======================================================
           STOP BUBBLES
           ====================================================== */


        function stopBubbles() {


          running = false;


          if (bubbleTimer) {


            clearInterval(
              bubbleTimer
            );


            bubbleTimer =
              null;


          }



          /* REMOVE EXISTING BUBBLES */

          const bubbles =
            target.querySelectorAll(
              ".pipe-bubble"
            );


          bubbles.forEach(

            function (bubble) {


              bubble.remove();


            }

          );


        }



        /* ======================================================
           FACE FOUND / LOST
           ====================================================== */


        target.addEventListener(

          "targetFound",

          function () {


            startBubbles();


          }

        );



        target.addEventListener(

          "targetLost",

          function () {


            stopBubbles();


          }

        );


      }


    });


  </script>

</head>



<body>


<button
  id="backButton"
  type="button"
>
  ← BACK
</button>


<button
  id="switchCamera"
  type="button"
>
  ↻ CAMERA
</button>


<div id="instruction">
  SWITCH FRONT / BACK CAMERA
</div>



<a-scene

  id="faceScene"

  mindar-face="
    autoStart: true;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

>


  <!-- ======================================================
       ASSETS
       ====================================================== -->

  <a-assets>


    <img
      id="hatImage"
      src="./hat.png"
      crossorigin="anonymous"
    >


    <img
      id="mouthImage"
      src="./catnose.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <!-- CAMERA -->

  <a-camera

    active="false"

    position="0 0 0"

  >
  </a-camera>



  <!-- ======================================================
       SALTY SAILOR HAT + CAT EARS
       ====================================================== -->

  <a-entity

    mindar-face-target="
      anchorIndex: 10
    "

  >


    <a-image

      src="#hatImage"

      position="
        0.00
        0.20
        0.05
      "

      width="
        1.75
      "

      height="
        0.95
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
        depthTest: false;
      "

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       CAT NOSE + WHISKERS + PIPE

       BUBBLES ARE ATTACHED TO THIS FACE ANCHOR
       ====================================================== -->

  <a-entity

    id="mouthTarget"

    mindar-face-target="
      anchorIndex: 152
    "

    pipe-bubbles

  >


    <a-image

      src="#mouthImage"

      position="
        0.03
        0.30
        0.12
      "

      width="
        1.70
      "

      height="
        0.95
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
        depthTest: false;
      "

    >
    </a-image>


  </a-entity>


</a-scene>



<script>


  document.addEventListener(

    "DOMContentLoaded",

    function () {


      const scene =
        document.getElementById(
          "faceScene"
        );


      const backButton =
        document.getElementById(
          "backButton"
        );


      const switchButton =
        document.getElementById(
          "switchCamera"
        );


      let arSystem =
        null;



      /* BACK */

      backButton.addEventListener(

        "click",

        function () {


          window.location.href =
            "./index.html";


        }

      );



      /* GET MINDAR FACE SYSTEM */

      scene.addEventListener(

        "loaded",

        function () {


          arSystem =

            scene.systems[
              "mindar-face-system"
            ];


        }

      );



      /* SWITCH FRONT / REAR CAMERA */

      switchButton.addEventListener(

        "click",

        async function () {


          if (!arSystem) {


            arSystem =

              scene.systems[
                "mindar-face-system"
              ];


          }


          if (

            arSystem &&

            typeof arSystem.switchCamera
              === "function"

          ) {


            try {


              await arSystem
                .switchCamera();


            }


            catch (error) {


              console.log(
                "Camera switch error:",
                error
              );


            }


          }


        }

      );


    }

  );


</script>


</body>

</html>
