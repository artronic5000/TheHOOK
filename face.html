<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR FACE TRACKING -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: black;

    }


    #backButton {

      position: fixed;

      top: 18px;

      left: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.7);

      background:
        rgba(0,0,0,0.65);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

    }

  </style>

</head>



<body>


<button
  id="backButton"
  type="button"
  onclick="window.location.href='./index.html';"
>
  ← BACK
</button>



<a-scene

  mindar-face="autoStart: true"

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

>


  <!-- ======================================================
       FACE FILTER ASSETS
       ====================================================== -->

  <a-assets>


    <img
      id="earsImage"
      src="./catears.png"
      crossorigin="anonymous"
    >


    <img
      id="beardImage"
      src="./beard.png"
      crossorigin="anonymous"
    >


    <img
      id="pipeImage"
      src="./pipe.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <!-- ======================================================
       CAMERA
       ====================================================== -->

  <a-camera

    active="false"

    position="0 0 0"

  >
  </a-camera>



  <!-- ======================================================
       CAT EARS
       ====================================================== -->

  <a-entity

    mindar-face-target="anchorIndex: 10"

  >


    <a-image

      src="#earsImage"

      position="0 0.50 0.02"

      width="1.65"

      height="0.85"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
      "

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       BEARD
       ====================================================== -->

  <a-entity

    mindar-face-target="anchorIndex: 152"

  >


    <a-image

      src="#beardImage"

      position="0 -0.04 0.05"

      width="1.40"

      height="1.10"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
      "

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       PIPE
       ====================================================== -->

  <a-entity

    mindar-face-target="anchorIndex: 61"

  >


    <a-image

      src="#pipeImage"

      position="0.36 -0.04 0.08"

      width="0.80"

      height="0.40"

      rotation="0 0 -8"

      material="
        shader: flat;
        transparent: true;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
      "

    >
    </a-image>


  </a-entity>


</a-scene>


</body>

</html>
