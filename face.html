<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR FACE -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    /* CAMERA VIDEO */

    video {

      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;

    }


    /* BACK BUTTON */

    #backButton {

      position: fixed;

      top: 18px;
      left: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    /* CAMERA SWITCH BUTTON */

    #switchCamera {

      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    /* BOTTOM INSTRUCTION */

    #instruction {

      position: fixed;

      bottom: 22px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 99999;

      padding: 8px 14px;

      border-radius: 18px;

      background:
        rgba(0,0,0,0.45);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 11px;

      letter-spacing: 1px;

      white-space: nowrap;

    }

  </style>

</head>



<body>


<!-- BACK BUTTON -->

<button
  id="backButton"
  type="button"
>
  ← BACK
</button>



<!-- CAMERA SWITCH -->

<button
  id="switchCamera"
  type="button"
>
  ↻ CAMERA
</button>



<div id="instruction">
  SWITCH FRONT / BACK CAMERA
</div>



<!-- =========================================================
     FACE AR SCENE
     ========================================================= -->

<a-scene

  id="faceScene"

  mindar-face="
    autoStart: true;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

>


  <!-- ASSETS -->

  <a-assets>


    <img
      id="earsImage"
      src="./catears.png"
      crossorigin="anonymous"
    >


    <img
      id="beardImage"
      src="./beard.png"
      crossorigin="anonymous"
    >


    <img
      id="pipeImage"
      src="./pipe.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <!-- CAMERA -->

  <a-camera
    active="false"
    position="0 0 0"
  >
  </a-camera>



  <!-- ======================================================
       CAT EARS

       X stays -0.30

       OLD Y = 0.50
       NEW Y = 0.30

       EARS MOVED DOWN 0.20
       ====================================================== -->

  <a-entity
    mindar-face-target="
      anchorIndex: 10
    "
  >


    <a-image

      src="#earsImage"

      position="
        -0.30
        0.30
        0.02
      "

      width="
        1.65
      "

      height="
        0.85
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
      "

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       BEARD

       X stays -0.30

       OLD Y = -0.14
       NEW Y = 0.06

       BEARD MOVED UP 0.20
       ====================================================== -->

  <a-entity
    mindar-face-target="
      anchorIndex: 152
    "
  >


    <a-image

      src="#beardImage"

      position="
        -0.30
        0.06
        0.05
      "

      width="
        1.40
      "

      height="
        1.10
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
      "

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       PIPE

       NO CHANGE

       X = 0.36
       Y = -0.14
       Z = 0.08
       ====================================================== -->

  <a-entity
    mindar-face-target="
      anchorIndex: 61
    "
  >


    <a-image

      src="#pipeImage"

      position="
        0.36
        -0.14
        0.08
      "

      width="
        0.80
      "

      height="
        0.40
      "

      rotation="
        0
        0
        -8
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
      "

    >
    </a-image>


  </a-entity>


</a-scene>



<script>


  document.addEventListener(

    "DOMContentLoaded",

    function () {


      const scene =
        document.getElementById(
          "faceScene"
        );


      const backButton =
        document.getElementById(
          "backButton"
        );


      const switchButton =
        document.getElementById(
          "switchCamera"
        );


      let arSystem =
        null;



      /* BACK */

      backButton.addEventListener(

        "click",

        function () {

          window.location.href =
            "./index.html";

        }

      );



      /* GET MINDAR SYSTEM */

      scene.addEventListener(

        "loaded",

        function () {


          arSystem =

            scene.systems[
              "mindar-face-system"
            ];


        }

      );



      /* SWITCH CAMERA */

      switchButton.addEventListener(

        "click",

        async function () {


          if (!arSystem) {


            arSystem =

              scene.systems[
                "mindar-face-system"
              ];


          }


          if (

            arSystem &&

            typeof arSystem.switchCamera
              === "function"

          ) {


            try {


              await arSystem
                .switchCamera();


            }

            catch (error) {


              console.log(
                "Camera switch error:",
                error
              );


            }


          }


        }

      );


    }

  );


</script>


</body>

</html>
