<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR FACE -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    #backButton {

      position: fixed;

      top: 18px;
      left: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #switchCamera {

      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #instruction {

      position: fixed;

      bottom: 22px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 99999;

      padding: 8px 14px;

      border-radius: 18px;

      background:
        rgba(0,0,0,0.45);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 11px;

      letter-spacing: 1px;

      white-space: nowrap;

    }

  </style>

</head>



<body>


<button
  id="backButton"
  type="button"
>
  ← BACK
</button>


<button
  id="switchCamera"
  type="button"
>
  ↻ CAMERA
</button>


<div id="instruction">
  SWITCH FRONT / BACK CAMERA
</div>



<a-scene

  id="faceScene"

  mindar-face="
    autoStart: true;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

>


  <!-- ======================================================
       NEW ASSETS
       ====================================================== -->

  <a-assets>


    <img
      id="hatImage"
      src="./hat.png"
      crossorigin="anonymous"
    >


    <img
      id="mouthImage"
      src="./catnose.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <!-- CAMERA -->

  <a-camera
    active="false"
    position="0 0 0"
  >
  </a-camera>



  <!-- ======================================================
       SALTY SAILOR HAT + CAT EARS

       X = left / right
       Y = up / down
       Z = front / back

       Start here:
       0.00  0.32  0.05
       ====================================================== -->

  <a-entity
    mindar-face-target="
      anchorIndex: 10
    "
  >


    <a-image

      src="#hatImage"

      position="
        0.00
        0.20
        0.05
      "

      width="
        1.75
      "

      height="
        0.95
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
        depthTest: false;
      "

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       CAT MOUTH + WHISKERS + PIPE

       Start here:
       0.00  -0.02  0.12

       You will probably only need to
       tweak X and Y slightly after testing.
       ====================================================== -->

  <a-entity
    mindar-face-target="
      anchorIndex: 152
    "
  >


    <a-image

      src="#mouthImage"

      position="
        0.03
        0.30
        0.12
      "

      width="
        1.70
      "

      height="
        0.95
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
        depthTest: false;
      "

    >
    </a-image>


  </a-entity>


</a-scene>



<script>


  document.addEventListener(

    "DOMContentLoaded",

    function () {


      const scene =
        document.getElementById(
          "faceScene"
        );


      const backButton =
        document.getElementById(
          "backButton"
        );


      const switchButton =
        document.getElementById(
          "switchCamera"
        );


      let arSystem =
        null;



      /* BACK */

      backButton.addEventListener(

        "click",

        function () {

          window.location.href =
            "./index.html";

        }

      );



      /* GET MINDAR FACE SYSTEM */

      scene.addEventListener(

        "loaded",

        function () {


          arSystem =

            scene.systems[
              "mindar-face-system"
            ];


        }

      );



      /* SWITCH FRONT / REAR CAMERA */

      switchButton.addEventListener(

        "click",

        async function () {


          if (!arSystem) {


            arSystem =

              scene.systems[
                "mindar-face-system"
              ];


          }


          if (

            arSystem &&

            typeof arSystem.switchCamera
              === "function"

          ) {


            try {


              await arSystem
                .switchCamera();


            }

            catch (error) {


              console.log(
                "Camera switch error:",
                error
              );


            }


          }


        }

      );


    }

  );


</script>


</body>

</html>
