<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR FACE -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    #backButton {

      position: fixed;

      top: 18px;
      left: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #switchCamera {

      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 99999;

      padding: 11px 16px;

      border-radius: 22px;

      border:
        1px solid rgba(255,255,255,0.75);

      background:
        rgba(0,0,0,0.60);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 14px;

      letter-spacing: 1px;

      cursor: pointer;

    }


    #instruction {

      position: fixed;

      bottom: 22px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 99999;

      padding: 8px 14px;

      border-radius: 18px;

      background:
        rgba(0,0,0,0.45);

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 11px;

      letter-spacing: 1px;

      white-space: nowrap;

    }

  </style>

</head>



<body>


<button
  id="backButton"
  type="button"
>
  ← BACK
</button>


<button
  id="switchCamera"
  type="button"
>
  ↻ CAMERA
</button>


<div id="instruction">
  SWITCH FRONT / BACK CAMERA
</div>



<a-scene

  id="faceScene"

  mindar-face="
    autoStart: true;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
    antialias: true;
  "

  vr-mode-ui="
    enabled: false
  "

  device-orientation-permission-ui="
    enabled: false
  "

>


  <!-- ======================================================
       ASSETS
       ====================================================== -->

  <a-assets>


    <img
      id="hatImage"
      src="./hat.png"
      crossorigin="anonymous"
    >


    <img
      id="mouthImage"
      src="./catnose.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <!-- CAMERA -->

  <a-camera
    active="false"
    position="0 0 0"
  >
  </a-camera>



  <!-- ======================================================
       HAT
       ====================================================== -->

  <a-entity
    mindar-face-target="
      anchorIndex: 10
    "
  >


    <a-image

      src="#hatImage"

      position="
        0.00
        0.20
        0.05
      "

      width="
        1.75
      "

      height="
        0.95
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
        depthTest: false;
      "

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       CAT NOSE + WHISKERS + PIPE
       ====================================================== -->

  <a-entity

    mindar-face-target="
      anchorIndex: 152
    "

  >


    <a-image

      src="#mouthImage"

      position="
        0.03
        0.30
        0.12
      "

      width="
        1.70
      "

      height="
        0.95
      "

      material="
        shader: flat;
        transparent: true;
        opacity: 1;
        alphaTest: 0.01;
        side: double;
        depthWrite: false;
        depthTest: false;
      "

    >
    </a-image>



    <!-- ===================================================
         BUBBLE 1
         STARTS AT PIPE BOWL

         Change the FIRST two numbers below
         to move the bubble source:

         X = left / right
         Y = up / down

         Current source:
         X 0.66
         Y 0.28
         =================================================== -->

    <a-ring

      position="
        0.66
        0.28
        0.30
      "

      radius-inner="0.035"

      radius-outer="0.055"

      material="
        shader: flat;
        color: #ffffff;
        transparent: true;
        opacity: 0.90;
        side: double;
        depthTest: false;
        depthWrite: false;
      "

      animation__move="
        property: position;
        from: 0.66 0.28 0.30;
        to: 0.56 1.05 0.30;
        dur: 2600;
        loop: true;
        easing: easeOutSine;
      "

      animation__scale="
        property: scale;
        from: 0.6 0.6 0.6;
        to: 1.7 1.7 1.7;
        dur: 2600;
        loop: true;
        easing: easeOutSine;
      "

      animation__fade="
        property: material.opacity;
        from: 0.90;
        to: 0.10;
        dur: 2600;
        loop: true;
        easing: linear;
      "

    >
    </a-ring>



    <!-- BUBBLE 2 -->

    <a-ring

      position="
        0.66
        0.28
        0.31
      "

      radius-inner="0.045"

      radius-outer="0.065"

      material="
        shader: flat;
        color: #dffaff;
        transparent: true;
        opacity: 0;
        side: double;
        depthTest: false;
        depthWrite: false;
      "

      animation__move="
        property: position;
        from: 0.66 0.28 0.31;
        to: 0.82 1.18 0.31;
        dur: 3100;
        delay: 650;
        loop: true;
        easing: easeOutSine;
      "

      animation__scale="
        property: scale;
        from: 0.55 0.55 0.55;
        to: 1.8 1.8 1.8;
        dur: 3100;
        delay: 650;
        loop: true;
        easing: easeOutSine;
      "

      animation__fade="
        property: material.opacity;
        from: 0.85;
        to: 0.05;
        dur: 3100;
        delay: 650;
        loop: true;
        easing: linear;
      "

    >
    </a-ring>



    <!-- BUBBLE 3 -->

    <a-ring

      position="
        0.66
        0.28
        0.32
      "

      radius-inner="0.027"

      radius-outer="0.045"

      material="
        shader: flat;
        color: #ffffff;
        transparent: true;
        opacity: 0;
        side: double;
        depthTest: false;
        depthWrite: false;
      "

      animation__move="
        property: position;
        from: 0.66 0.28 0.32;
        to: 0.46 0.92 0.32;
        dur: 2200;
        delay: 1250;
        loop: true;
        easing: easeOutSine;
      "

      animation__scale="
        property: scale;
        from: 0.6 0.6 0.6;
        to: 1.5 1.5 1.5;
        dur: 2200;
        delay: 1250;
        loop: true;
        easing: easeOutSine;
      "

      animation__fade="
        property: material.opacity;
        from: 0.85;
        to: 0.05;
        dur: 2200;
        delay: 1250;
        loop: true;
        easing: linear;
      "

    >
    </a-ring>



    <!-- BUBBLE 4 -->

    <a-ring

      position="
        0.66
        0.28
        0.33
      "

      radius-inner="0.055"

      radius-outer="0.075"

      material="
        shader: flat;
        color: #e8fbff;
        transparent: true;
        opacity: 0;
        side: double;
        depthTest: false;
        depthWrite: false;
      "

      animation__move="
        property: position;
        from: 0.66 0.28 0.33;
        to: 0.73 1.25 0.33;
        dur: 3400;
        delay: 1800;
        loop: true;
        easing: easeOutSine;
      "

      animation__scale="
        property: scale;
        from: 0.5 0.5 0.5;
        to: 1.65 1.65 1.65;
        dur: 3400;
        delay: 1800;
        loop: true;
        easing: easeOutSine;
      "

      animation__fade="
        property: material.opacity;
        from: 0.80;
        to: 0.05;
        dur: 3400;
        delay: 1800;
        loop: true;
        easing: linear;
      "

    >
    </a-ring>



    <!-- BUBBLE 5 -->

    <a-ring

      position="
        0.66
        0.28
        0.34
      "

      radius-inner="0.030"

      radius-outer="0.050"

      material="
        shader: flat;
        color: #ffffff;
        transparent: true;
        opacity: 0;
        side: double;
        depthTest: false;
        depthWrite: false;
      "

      animation__move="
        property: position;
        from: 0.66 0.28 0.34;
        to: 0.90 1.00 0.34;
        dur: 2800;
        delay: 2350;
        loop: true;
        easing: easeOutSine;
      "

      animation__scale="
        property: scale;
        from: 0.5 0.5 0.5;
        to: 1.75 1.75 1.75;
        dur: 2800;
        delay: 2350;
        loop: true;
        easing: easeOutSine;
      "

      animation__fade="
        property: material.opacity;
        from: 0.85;
        to: 0.05;
        dur: 2800;
        delay: 2350;
        loop: true;
        easing: linear;
      "

    >
    </a-ring>


  </a-entity>


</a-scene>



<script>


  document.addEventListener(

    "DOMContentLoaded",

    function () {


      const scene =
        document.getElementById(
          "faceScene"
        );


      const backButton =
        document.getElementById(
          "backButton"
        );


      const switchButton =
        document.getElementById(
          "switchCamera"
        );


      let arSystem =
        null;



      backButton.addEventListener(

        "click",

        function () {

          window.location.href =
            "./index.html";

        }

      );



      scene.addEventListener(

        "loaded",

        function () {

          arSystem =
            scene.systems[
              "mindar-face-system"
            ];

        }

      );



      switchButton.addEventListener(

        "click",

        async function () {


          if (!arSystem) {

            arSystem =
              scene.systems[
                "mindar-face-system"
              ];

          }


          if (

            arSystem &&

            typeof arSystem.switchCamera
              === "function"

          ) {


            try {

              await arSystem
                .switchCamera();

            }


            catch (error) {

              console.log(
                "Camera switch error:",
                error
              );

            }


          }


        }

      );


    }

  );


</script>


</body>

</html>
