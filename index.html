<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR IMAGE -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }


    /* =====================================================
       LET'S MEET THE BAND
       ===================================================== */

    #meetBandIntro {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 88%;
      max-width: 460px;

      transform:
        translate(-50%, -50%)
        scale(.82);

      opacity: 0;

      display: none;

      transition:
        opacity .5s ease,
        transform .5s ease;

      z-index: 99999;

      pointer-events: none;
    }


    #meetBandIntro.show {

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);
    }


    #meetBandIntro img {

      display: block;

      width: 100%;
      height: auto;
    }


    /* =====================================================
       BAND NAMES
       ===================================================== */

    #bandNameStack {

      position: fixed;

      inset: 0;

      z-index: 99998;

      pointer-events: none;
    }


    .band-screen-name {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 88%;
      max-width: 460px;

      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(.9);

      transition:

        left .65s ease,
        top .65s ease,
        width .65s ease,
        opacity .3s ease,
        transform .65s ease;

      z-index: 99999;

      pointer-events: none;
    }


    .band-screen-name.flash {

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);
    }


    .band-screen-name.stacked {

      left: var(--stack-left);

      top: var(--stack-top);

      width: 32%;

      max-width: 175px;

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);
    }


    .band-screen-name.fade-away {

      opacity: 0;
    }


    /* =====================================================
       THE HOOK BUTTON
       ===================================================== */

    #hookButton {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 84%;
      max-width: 430px;

      padding: 0;

      border: 0;

      background: transparent;

      opacity: 0;

      display: none;

      transform:
        translate(-50%, -50%)
        scale(.82);

      transition:
        opacity .5s ease,
        transform .5s ease;

      pointer-events: auto;

      cursor: pointer;

      z-index: 99999;
    }


    #hookButton.show {

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);
    }


    #hookButton img {

      display: block;

      width: 100%;
      height: auto;
    }

  </style>



  <script>

    /* =========================================================
       TARGET 0

       BUBBLES
       →
       IRIDESCENT TAKEOVER
       →
       HUGE HEART
       →
       HEART FADES
       →
       MUSIC NOTES
       ========================================================= */


    AFRAME.registerComponent(

      "music-emitter",

      {

        init: function () {


          const target =
            this.el;


          let running =
            false;


          let bubbleTimer =
            null;


          let noteTimer =
            null;


          let timers =
            [];


          /* =================================================
             LOCATIONS
             ================================================= */


          /* MUSIC NOTES — AMP */

          const ampX =
            -0.15;


          const ampY =
            -0.30;



          /* BUBBLES — CIGARETTE */

          const bubbleX =
            -0.15;


          const bubbleY =
            0.30;



          /* HEART */

          const heartX =
            0.10;


          const heartY =
            0.25;



          /* THE HOOK ORANGE */

          const orange =
            "#FF5A00";



          /* =================================================
             TIMER HELPER
             ================================================= */

          function later(
            fn,
            delay
          ) {

            const id =
              setTimeout(
                fn,
                delay
              );


            timers.push(
              id
            );


            return id;

          }



          /* =================================================
             SVG HELPER
             ================================================= */

          function svgURL(
            svg
          ) {

            return (

              "data:image/svg+xml;charset=utf-8," +

              encodeURIComponent(
                svg
              )

            );

          }



          /* =================================================
             MUSIC NOTE SVG
             ================================================= */

          function makeNoteSVG(
            symbol
          ) {

            return `

              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="100"
                height="100"
                viewBox="0 0 100 100"
              >

                <text

                  x="50"

                  y="76"

                  text-anchor="middle"

                  font-family="Arial,sans-serif"

                  font-size="78"

                  font-weight="700"

                  fill="${orange}"

                >${symbol}</text>

              </svg>

            `;

          }



          const noteArt = [

            makeNoteSVG(
              "♪"
            ),

            makeNoteSVG(
              "♫"
            ),

            makeNoteSVG(
              "♩"
            )

          ];



          /* =================================================
             CREATE MUSIC NOTE
             ================================================= */
function createNote() {

  if (!running)
    return;


  /* ==============================================
     CREATE ONE NOTE-IN-A-BUBBLE
     ============================================== */

  const noteBubble =
    document.createElement(
      "a-plane"
    );


  noteBubble.classList.add(
    "target0-effect"
  );


  /* RANDOM MUSIC NOTE */

  const symbols = [
    "♪",
    "♫",
    "♩"
  ];


  const symbol =

    symbols[
      Math.floor(
        Math.random() *
        symbols.length
      )
    ];


  /* ==============================================
     IRIDESCENT BUBBLE COLOUR
     ============================================== */

  const bubbleColours = [

    "rgba(243,185,255,0.38)",

    "rgba(185,221,255,0.38)",

    "rgba(191,255,240,0.38)",

    "rgba(255,208,234,0.38)",

    "rgba(213,197,255,0.38)",

    "rgba(255,240,189,0.38)"

  ];


  const bubbleColour =

    bubbleColours[
      Math.floor(
        Math.random() *
        bubbleColours.length
      )
    ];


  /* ==============================================
     DRAW BUBBLE + ORANGE NOTE TOGETHER

     This is ONE SVG, which keeps the note
     safely inside its bubble.
     ============================================== */

  const noteBubbleSVG = `

    <svg

      xmlns="http://www.w3.org/2000/svg"

      width="140"

      height="140"

      viewBox="0 0 140 140"

    >


      <!-- BUBBLE -->

      <circle

        cx="70"

        cy="70"

        r="59"

        fill="${bubbleColour}"

        stroke="rgba(255,255,255,0.95)"

        stroke-width="3"

      />


      <!-- IRIDESCENT INNER GLOW -->

      <circle

        cx="70"

        cy="70"

        r="52"

        fill="none"

        stroke="rgba(255,255,255,0.28)"

        stroke-width="5"

      />


      <!-- LARGE SHINE -->

      <ellipse

        cx="48"

        cy="43"

        rx="15"

        ry="8"

        fill="rgba(255,255,255,0.90)"

      />


      <!-- SMALL SHINE -->

      <circle

        cx="42"

        cy="35"

        r="5"

        fill="#FFFFFF"

      />


      <!-- SECOND REFLECTION -->

      <ellipse

        cx="94"

        cy="94"

        rx="8"

        ry="5"

        fill="rgba(255,255,255,0.40)"

      />


      <!-- ORANGE MUSIC NOTE -->

      <text

        x="70"

        y="96"

        text-anchor="middle"

        font-family="Arial, sans-serif"

        font-size="76"

        font-weight="700"

        fill="#FF5A00"

      >${symbol}</text>


    </svg>

  `;


  noteBubble.setAttribute(

    "src",

    svgURL(
      noteBubbleSVG
    )

  );


  noteBubble.setAttribute(

    "material",

    `
    shader: flat;
    transparent: true;
    opacity: 1;
    side: double;
    alphaTest: 0.01;
    depthWrite: false;
    `

  );


  /* ==============================================
     START AT AMP

     SAME LOCATION AS OUR WORKING NOTES
     ============================================== */

  const startX =

    ampX +

    (Math.random() - 0.5) *
    0.035;


  const startY =

    ampY +

    (Math.random() - 0.5) *
    0.025;


  /* ==============================================
     FLOAT UP AND OUT
     ============================================== */

  const endX =

    startX +

    (Math.random() - 0.5) *
    0.48;


  const endY =

    startY +

    0.42 +

    Math.random() *
    0.42;


  /* SLIGHTLY DIFFERENT SIZES */

  const size =

    0.16 +

    Math.random() *
    0.10;


  const duration =

    2200 +

    Math.random() *
    1200;


  noteBubble.setAttribute(
    "width",
    size
  );


  noteBubble.setAttribute(
    "height",
    size
  );


  noteBubble.setAttribute(

    "position",

    `${startX} ${startY} 0.14`

  );


  /* START SMALL */

  noteBubble.setAttribute(

    "scale",

    "0.25 0.25 0.25"

  );


  /* ==============================================
     FLOAT UP
     ============================================== */

  noteBubble.setAttribute(

    "animation__move",

    `
    property: position;

    from:
    ${startX}
    ${startY}
    0.14;

    to:
    ${endX}
    ${endY}
    0.14;

    dur:
    ${duration};

    easing:
    easeOutSine;
    `

  );


  /* ==============================================
     BUBBLE GROWS AS IT RISES
     ============================================== */

  noteBubble.setAttribute(

    "animation__grow",

    `
    property: scale;

    from:
    0.25 0.25 0.25;

    to:
    1 1 1;

    dur:
    ${duration * 0.55};

    easing:
    easeOutQuad;
    `

  );


  /* ==============================================
     GENTLE WOBBLE
     ============================================== */

  const wobble =

    8 +

    Math.random() *
    10;


  noteBubble.setAttribute(

    "animation__wobble",

    `
    property: rotation;

    from:
    0 0 -${wobble};

    to:
    0 0 ${wobble};

    dur:
    ${550 + Math.random() * 300};

    dir:
    alternate;

    loop:
    true;

    easing:
    easeInOutSine;
    `

  );


  /* ==============================================
     FADE NEAR TOP
     ============================================== */

  noteBubble.setAttribute(

    "animation__fade",

    `
    property:
    material.opacity;

    from:
    1;

    to:
    0;

    delay:
    ${duration * 0.72};

    dur:
    ${duration * 0.28};

    easing:
    easeInQuad;
    `

  );


  target.appendChild(
    noteBubble
  );


  /* REMOVE WHEN FINISHED */

  later(

    function () {

      if (
        noteBubble.parentNode
      ) {

        noteBubble.remove();

      }

    },

    duration + 250

  );

}
          /* =================================================
             BUBBLE ART
             ================================================= */

          function bubbleSVG(
            stage
          ) {


            let fill;

            let stroke;

            let shine2;



            /* WHITE */

            if (
              stage === 1
            ) {

              fill =
                "rgba(255,255,255,.16)";


              stroke =
                "rgba(255,255,255,.95)";


              shine2 =
                "rgba(255,255,255,.55)";

            }



            /* PEARL */

            else if (
              stage === 2
            ) {


              const pearls = [

                "rgba(255,210,245,.72)",

                "rgba(205,225,255,.72)",

                "rgba(210,255,245,.72)",

                "rgba(235,215,255,.72)"

              ];



              fill =

                pearls[

                  Math.floor(

                    Math.random() *
                    pearls.length

                  )

                ];



              stroke =
                "rgba(255,255,255,.95)";


              shine2 =
                "rgba(255,180,225,.72)";

            }



            /* IRIDESCENT */

            else {


              const colours = [

                "#F3B9FF",

                "#B9DDFF",

                "#BFFFF0",

                "#FFD0EA",

                "#D5C5FF",

                "#FFF0BD"

              ];



              fill =

                colours[

                  Math.floor(

                    Math.random() *
                    colours.length

                  )

                ];



              stroke =
                "#FFFFFF";


              shine2 =
                "rgba(255,255,255,.55)";

            }



            return `

              <svg

                xmlns="http://www.w3.org/2000/svg"

                width="100"

                height="100"

                viewBox="0 0 100 100"

              >


                <circle

                  cx="50"

                  cy="50"

                  r="43"

                  fill="${fill}"

                  stroke="${stroke}"

                  stroke-width="3"

                />


                <ellipse

                  cx="34"

                  cy="29"

                  rx="10"

                  ry="6"

                  fill="rgba(255,255,255,.95)"

                />


                <ellipse

                  cx="67"

                  cy="68"

                  rx="6"

                  ry="4"

                  fill="${shine2}"

                />


                <circle

                  cx="29"

                  cy="24"

                  r="3"

                  fill="#FFFFFF"

                />


              </svg>

            `;

          }



          /* =================================================
             CREATE BUBBLE
             ================================================= */

          function createBubble(
            stage
          ) {


            if (!running)
              return;



            const bubble =

              document.createElement(
                "a-plane"
              );



            bubble.classList.add(

              "target0-effect",

              "hook-bubble"

            );



            let endX;

            let endY;

            let size;

            let duration;



            /* SMALL WHITE */

            if (
              stage === 1
            ) {


              endX =

                bubbleX +

                (Math.random() - 0.5) *
                0.30;



              endY =

                bubbleY +

                0.18 +

                Math.random() *
                0.30;



              size =

                0.10 +

                Math.random() *
                0.12;



              duration =

                1200 +

                Math.random() *
                700;

            }



            /* PEARL SPREAD */

            else if (
              stage === 2
            ) {


              endX =

                (Math.random() - 0.5) *
                1.35;



              endY =

                (Math.random() - 0.5) *
                1.40;



              size =

                0.16 +

                Math.random() *
                0.22;



              duration =

                1000 +

                Math.random() *
                650;

            }



            /* SCREEN TAKEOVER */

            else {


              endX =

                (Math.random() - 0.5) *
                1.65;



              endY =

                (Math.random() - 0.5) *
                1.75;



              size =

                0.25 +

                Math.random() *
                0.38;



              duration =

                700 +

                Math.random() *
                500;

            }



            bubble.setAttribute(

              "src",

              svgURL(

                bubbleSVG(
                  stage
                )

              )

            );



            bubble.setAttribute(

              "material",

              `
              shader: flat;
              transparent: true;
              opacity: 0.92;
              side: double;
              depthWrite: false;
              `

            );



            bubble.setAttribute(
              "width",
              size
            );


            bubble.setAttribute(
              "height",
              size
            );



            bubble.setAttribute(

              "position",

              `${bubbleX} ${bubbleY} 0.15`

            );



            bubble.setAttribute(

              "scale",

              "0.10 0.10 0.10"

            );



            bubble.setAttribute(

              "animation__move",

              `
              property: position;

              from:
              ${bubbleX}
              ${bubbleY}
              0.15;

              to:
              ${endX}
              ${endY}
              0.15;

              dur:
              ${duration};

              easing:
              easeOutSine;
              `

            );



            bubble.setAttribute(

              "animation__grow",

              `
              property: scale;

              from:
              0.10 0.10 0.10;

              to:
              1 1 1;

              dur:
              ${duration * 0.75};

              easing:
              easeOutQuad;
              `

            );



            target.appendChild(
              bubble
            );



            if (
              stage === 1
            ) {

              later(

                function () {

                  if (
                    bubble.parentNode
                  ) {

                    bubble.remove();

                  }

                },

                duration + 500

              );

            }

          }



          /* =================================================
             GIANT HEART
             ================================================= */

          function heartBurst() {


            if (!running)
              return;



            const heart =

              target.querySelector(
                "#hookHeartAR"
              );



            if (!heart)
              return;



            heart.removeAttribute(
              "animation__burst"
            );


            heart.removeAttribute(
              "animation__shrink"
            );


            heart.removeAttribute(
              "animation__fade"
            );



            heart.setAttribute(

              "material",

              `
              shader: flat;
              transparent: true;
              opacity: 1;
              side: double;
              depthWrite: false;
              `

            );



            heart.setAttribute(

              "scale",

              "0.03 0.03 0.03"

            );



            /* HUGE HEART */

            heart.setAttribute(

              "animation__burst",

              `
              property: scale;

              from:
              0.03 0.03 0.03;

              to:
              3.2 3.2 3.2;

              dur:
              420;

              easing:
              easeOutBack;
              `

            );



            /* =============================================
               BLAST BUBBLES AWAY
               ============================================= */

            target
              .querySelectorAll(
                ".hook-bubble"
              )
              .forEach(

                function (
                  bubble
                ) {


                  bubble.removeAttribute(
                    "animation__move"
                  );


                  bubble.removeAttribute(
                    "animation__grow"
                  );



                  const p =

                    bubble.object3D.position;



                  let dx =
                    p.x - heartX;


                  let dy =
                    p.y - heartY;



                  let len =

                    Math.hypot(
                      dx,
                      dy
                    );



                  if (
                    len < 0.02
                  ) {

                    dx =
                      Math.random() - 0.5;


                    dy =
                      Math.random() - 0.5;


                    len =

                      Math.hypot(
                        dx,
                        dy
                      ) || 1;

                  }



                  dx /= len;

                  dy /= len;



                  const distance =

                    0.9 +

                    Math.random() *
                    0.9;



                  const blastX =

                    p.x +

                    dx *
                    distance;



                  const blastY =

                    p.y +

                    dy *
                    distance;



                  bubble.setAttribute(

                    "animation__blast",

                    `
                    property: position;

                    to:
                    ${blastX}
                    ${blastY}
                    0.15;

                    dur:
                    ${420 + Math.random() * 250};

                    easing:
                    easeOutQuad;
                    `

                  );



                  bubble.setAttribute(

                    "animation__blastfade",

                    `
                    property:
                    material.opacity;

                    from:
                    0.92;

                    to:
                    0;

                    dur:
                    650;

                    easing:
                    easeOutQuad;
                    `

                  );



                  later(

                    function () {

                      if (
                        bubble.parentNode
                      ) {

                        bubble.remove();

                      }

                    },

                    750

                  );

                }

              );



            /* =============================================
               HEART SHRINKS AND FADES
               NO PULSING HEART
               ============================================= */

            later(

              function () {


                if (!running)
                  return;



                heart.removeAttribute(
                  "animation__burst"
                );



                heart.setAttribute(

                  "scale",

                  "3.2 3.2 3.2"

                );



                heart.setAttribute(

                  "animation__shrink",

                  `
                  property: scale;

                  from:
                  3.2 3.2 3.2;

                  to:
                  0.45 0.45 0.45;

                  dur:
                  1400;

                  easing:
                  easeInOutSine;
                  `

                );



                heart.setAttribute(

                  "animation__fade",

                  `
                  property:
                  material.opacity;

                  from:
                  1;

                  to:
                  0;

                  dur:
                  1400;

                  easing:
                  easeInOutSine;
                  `

                );

              },

              520

            );

          }



          /* =================================================
             RESET TARGET 0
             ================================================= */

          function clearTarget0() {


            timers.forEach(
              clearTimeout
            );


            timers =
              [];



            if (
              bubbleTimer
            ) {

              clearInterval(
                bubbleTimer
              );

            }



            if (
              noteTimer
            ) {

              clearInterval(
                noteTimer
              );

            }



            bubbleTimer =
              null;


            noteTimer =
              null;



            target
              .querySelectorAll(
                ".target0-effect"
              )
              .forEach(

                function (
                  element
                ) {

                  element.remove();

                }

              );



            const heart =

              target.querySelector(
                "#hookHeartAR"
              );



            if (
              heart
            ) {


              heart.removeAttribute(
                "animation__burst"
              );


              heart.removeAttribute(
                "animation__shrink"
              );


              heart.removeAttribute(
                "animation__fade"
              );



              heart.setAttribute(

                "scale",

                "0.45 0.45 0.45"

              );



              heart.setAttribute(

                "material",

                `
                shader: flat;
                transparent: true;
                opacity: 0;
                side: double;
                depthWrite: false;
                `

              );

            }

          }



          /* =================================================
             TARGET 0 FOUND
             ================================================= */

          target.addEventListener(

            "targetFound",

            function () {


              clearTarget0();


              running =
                true;



              let stage =
                1;



              /* WHITE BUBBLES */

              bubbleTimer =

                setInterval(

                  function () {

                    createBubble(
                      stage
                    );

                  },

                  180

                );



              /* PEARL BUBBLES */

              later(

                function () {


                  stage =
                    2;



                  clearInterval(
                    bubbleTimer
                  );



                  bubbleTimer =

                    setInterval(

                      function () {


                        createBubble(
                          2
                        );



                        if (
                          Math.random() >
                          0.45
                        ) {

                          createBubble(
                            2
                          );

                        }

                      },

                      120

                    );

                },

                1000

              );



              /* IRIDESCENT TAKEOVER */

              later(

                function () {


                  stage =
                    3;



                  clearInterval(
                    bubbleTimer
                  );



                  bubbleTimer =

                    setInterval(

                      function () {


                        createBubble(
                          3
                        );


                        createBubble(
                          3
                        );



                        if (
                          Math.random() >
                          0.35
                        ) {

                          createBubble(
                            3
                          );

                        }

                      },

                      90

                    );

                },

                2000

              );



              /* STOP MAKING BUBBLES */

              later(

                function () {


                  clearInterval(
                    bubbleTimer
                  );


                  bubbleTimer =
                    null;

                },

                3250

              );



              /* GIANT HEART */

              later(

                heartBurst,

                3450

              );



              /* ===========================================
                 MUSIC NOTES

                 AFTER BIG HEART BEGINS CLEARING

                 AMP:
                 -0.15
                 -0.30
                 =========================================== */

              later(

                function () {


                  if (!running)
                    return;



                  createNote();



                  noteTimer =

                    setInterval(

                      createNote,

                      350

                    );

                },

                4800

              );

            }

          );



          /* =================================================
             TARGET 0 LOST
             ================================================= */

          target.addEventListener(

            "targetLost",

            function () {


              running =
                false;


              clearTarget0();

            }

          );

        }

      }

    );



    /* =========================================================
       TARGET 1
       LET'S MEET THE BAND
       ========================================================= */


    AFRAME.registerComponent(

      "band-intro",

      {

        init: function () {


          const target =
            this.el;


          let running =
            false;


          let timers =
            [];



          const nameIds = [

            "screenNick",

            "screenSean",

            "screenGaz",

            "screenRyan",

            "screenMichael"

          ];



          function later(
            fn,
            delay
          ) {

            const id =

              setTimeout(
                fn,
                delay
              );


            timers.push(
              id
            );

          }



          function reset() {


            timers.forEach(
              clearTimeout
            );


            timers =
              [];



            const intro =

              document.getElementById(
                "meetBandIntro"
              );



            if (
              intro
            ) {

              intro.classList.remove(
                "show"
              );


              intro.style.display =
                "none";

            }



            nameIds.forEach(

              function (
                id
              ) {


                const element =

                  document.getElementById(
                    id
                  );



                if (!element)
                  return;



                element.classList.remove(

                  "flash",

                  "stacked",

                  "fade-away"

                );

              }

            );



            const button =

              document.getElementById(
                "hookButton"
              );



            if (
              button
            ) {

              button.classList.remove(
                "show"
              );


              button.style.display =
                "none";

            }

          }



          function showName(
            id
          ) {


            if (!running)
              return;



            const element =

              document.getElementById(
                id
              );



            if (!element)
              return;



            /* FULL SCREEN */

            element.classList.add(
              "flash"
            );



            /* SHRINK TO STACK */

            later(

              function () {


                if (!running)
                  return;



                element.classList.remove(
                  "flash"
                );


                element.classList.add(
                  "stacked"
                );

              },

              850

            );

          }



          function showNameAfter(
            id,
            delay
          ) {

            later(

              function () {

                showName(
                  id
                );

              },

              delay

            );

          }



          /* =================================================
             TARGET 1 FOUND
             ================================================= */

          target.addEventListener(

            "targetFound",

            function () {


              reset();


              running =
                true;



              const intro =

                document.getElementById(
                  "meetBandIntro"
                );



              /* LET'S MEET THE BAND */

              if (
                intro
              ) {


                intro.style.display =
                  "block";



                requestAnimationFrame(

                  function () {

                    intro.classList.add(
                      "show"
                    );

                  }

                );

              }



              later(

                function () {


                  if (
                    intro
                  ) {


                    intro.classList.remove(
                      "show"
                    );



                    later(

                      function () {

                        intro.style.display =
                          "none";

                      },

                      500

                    );

                  }

                },

                1800

              );



              /* NAMES */

              showNameAfter(
                "screenNick",
                2300
              );


              showNameAfter(
                "screenSean",
                3700
              );


              showNameAfter(
                "screenGaz",
                5100
              );


              showNameAfter(
                "screenRyan",
                6500
              );


              showNameAfter(
                "screenMichael",
                7900
              );



              /* KEEP STACK FOR 2 SEC THEN FADE */

              later(

                function () {


                  nameIds.forEach(

                    function (
                      id
                    ) {


                      const element =

                        document.getElementById(
                          id
                        );



                      if (
                        element
                      ) {

                        element.classList.add(
                          "fade-away"
                        );

                      }

                    }

                  );

                },

                9700

              );



              /* THE HOOK LOGO */

              later(

                function () {


                  if (!running)
                    return;



                  const button =

                    document.getElementById(
                      "hookButton"
                    );



                  if (
                    button
                  ) {


                    button.style.display =
                      "block";



                    requestAnimationFrame(

                      function () {

                        button.classList.add(
                          "show"
                        );

                      }

                    );

                  }

                },

                10300

              );

            }

          );



          /* =================================================
             TARGET 1 LOST
             ================================================= */

          target.addEventListener(

            "targetLost",

            function () {


              running =
                false;


              reset();

            }

          );

        }

      }

    );



    /* =========================================================
       HOOK LOGO CLICK
       OPEN FACE FILTER
       ========================================================= */

    window.addEventListener(

      "DOMContentLoaded",

      function () {


        const hookButton =

          document.getElementById(
            "hookButton"
          );



        if (
          hookButton
        ) {


          hookButton.addEventListener(

            "click",

            function () {


              window.location.href =
                "./face.html";

            }

          );

        }

      }

    );

  </script>

</head>



<body>


  <!-- ======================================================
       LET'S MEET THE BAND INTRO
       ====================================================== -->

  <div
    id="meetBandIntro"
  >

    <img

      src="./meettheband.png"

      alt="Let's Meet The Band"

    >

  </div>



  <!-- ======================================================
       BAND NAME STACK
       ====================================================== -->

  <div
    id="bandNameStack"
  >


    <img

      id="screenNick"

      class="band-screen-name"

      src="./nick.png"

      alt="Nick"

      style="
        --stack-top:18%;
        --stack-left:40%;
      "

    >


    <img

      id="screenSean"

      class="band-screen-name"

      src="./sean.png"

      alt="Sean"

      style="
        --stack-top:34%;
        --stack-left:60%;
      "

    >


    <img

      id="screenGaz"

      class="band-screen-name"

      src="./gaz.png"

      alt="Gaz"

      style="
        --stack-top:50%;
        --stack-left:40%;
      "

    >


    <img

      id="screenRyan"

      class="band-screen-name"

      src="./ryan.png"

      alt="Ryan"

      style="
        --stack-top:66%;
        --stack-left:60%;
      "

    >


    <img

      id="screenMichael"

      class="band-screen-name"

      src="./michael.png"

      alt="Michael"

      style="
        --stack-top:82%;
        --stack-left:40%;
      "

    >


  </div>



  <!-- ======================================================
       THE HOOK FACE FILTER BUTTON
       ====================================================== -->

  <button

    id="hookButton"

    type="button"

    aria-label="Open The Hook face filter"

  >

    <img

      src="./hooklogo.png"

      alt="The Hook"

    >

  </button>



  <!-- ======================================================
       AR SCENE
       ====================================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
    "

    embedded

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "

  >


    <!-- ==================================================
         ASSETS
         ================================================== -->

    <a-assets>


      <img

        id="hookHeart"

        src="./hookheart.png"

        crossorigin="anonymous"

      >


    </a-assets>



    <!-- ==================================================
         CAMERA
         ================================================== -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

    >

    </a-camera>



    <!-- ==================================================
         TARGET 0
         HOOK BUBBLES STICKER
         ================================================== -->

    <a-entity

      id="hookedTarget"

      mindar-image-target="
        targetIndex: 0
      "

      music-emitter

    >


      <!-- BIG HEART -->

      <a-image

        id="hookHeartAR"

        src="#hookHeart"

        position="
          .1 .25 .02
        "

        width="
          .45
        "

        height="
          .45
        "

        scale="
          .45 .45 .45
        "

        material="
          shader: flat;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
        "

      >

      </a-image>


    </a-entity>



    <!-- ==================================================
         TARGET 1
         BAND
         ================================================== -->

    <a-entity

      id="hookCatTarget"

      mindar-image-target="
        targetIndex: 1
      "

      band-intro

    >

    </a-entity>


  </a-scene>


</body>

</html>
