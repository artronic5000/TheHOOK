<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR IMAGE TRACKING -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }


    /* ======================================================
       THE HOOK BUTTON
       ====================================================== */

    #hookButton {

      position: fixed;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        scale(0.82);

      z-index: 99999;

      display: none;

      width: 82%;
      max-width: 420px;

      padding: 30px 20px;

      background:
        rgba(0, 0, 0, 0.96);

      border:
        2px solid #f4f8ff;

      border-radius: 8px;

      color:
        #f4f8ff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 38px;

      font-weight: bold;

      letter-spacing: 8px;

      text-align: center;

      cursor: pointer;

      opacity: 0;

      box-shadow:
        0 0 12px rgba(255,255,255,0.45),
        0 0 30px rgba(210,230,255,0.20);

      transition:
        opacity 0.5s ease,
        transform 0.5s ease;

    }


    #hookButton.show {

      display: block;

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);

    }


    #hookButton small {

      display: block;

      margin-top: 12px;

      font-size: 11px;

      font-weight: normal;

      letter-spacing: 3px;

      color:
        #d8e3ef;

    }

  </style>


  <script>


    /* ==========================================================
       TARGET 0
       MUSIC NOTE EMITTER
       ========================================================== */


    AFRAME.registerComponent(
      "music-emitter",
      {

        init: function () {

          const target =
            this.el;

          let noteTimer =
            null;

          let running =
            false;


          /* =========================================
             AMP LOCATION
             ========================================= */

          const ampX =
            -0.15;

          const ampY =
            -0.30;


          /* =========================================
             MUSIC NOTES
             ========================================= */

          const notes = [

            `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="100"
              height="100"
              viewBox="0 0 100 100"
            >
              <text
                x="50"
                y="74"
                text-anchor="middle"
                font-size="78"
                font-family="Arial, sans-serif"
                fill="#2b2b2b"
              >♪</text>
            </svg>
            `,

            `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="100"
              height="100"
              viewBox="0 0 100 100"
            >
              <text
                x="50"
                y="74"
                text-anchor="middle"
                font-size="74"
                font-family="Arial, sans-serif"
                fill="#2b2b2b"
              >♫</text>
            </svg>
            `,

            `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="100"
              height="100"
              viewBox="0 0 100 100"
            >
              <text
                x="50"
                y="74"
                text-anchor="middle"
                font-size="78"
                font-family="Arial, sans-serif"
                fill="#2b2b2b"
              >♩</text>
            </svg>
            `

          ];


          function svgToDataURL(svg) {

            return (

              "data:image/svg+xml;charset=utf-8," +

              encodeURIComponent(svg)

            );

          }


          function createNote() {

            if (!running)
              return;


            const note =
              document.createElement(
                "a-plane"
              );


            const svg =

              notes[
                Math.floor(
                  Math.random() *
                  notes.length
                )
              ];


            const startX =

              ampX +

              (Math.random() - 0.5) *
              0.025;


            const startY =

              ampY +

              (Math.random() - 0.5) *
              0.020;


            const driftX =

              (Math.random() - 0.5) *
              0.45;


            const rise =

              0.32 +

              Math.random() *
              0.42;


            const endX =
              startX + driftX;


            const endY =
              startY + rise;


            const duration =

              1800 +

              Math.random() *
              1300;


            const finalScale =

              1.0 +

              Math.random() *
              0.8;


            const rotateAmount =

              18 +

              Math.random() *
              30;


            note.setAttribute(
              "src",
              svgToDataURL(svg)
            );


            note.setAttribute(
              "material",
              `
                shader: flat;
                transparent: true;
                opacity: 1;
                side: double;
                alphaTest: 0.01;
                depthWrite: false;
              `
            );


            note.setAttribute(
              "width",
              "0.28"
            );


            note.setAttribute(
              "height",
              "0.28"
            );


            note.setAttribute(
              "position",
              `${startX} ${startY} 0.08`
            );


            note.setAttribute(
              "scale",
              "0.35 0.35 0.35"
            );


            note.setAttribute(
              "animation__move",
              `
                property: position;
                from: ${startX} ${startY} 0.08;
                to: ${endX} ${endY} 0.08;
                dur: ${duration};
                easing: easeOutSine;
              `
            );


            note.setAttribute(
              "animation__grow",
              `
                property: scale;
                from: 0.35 0.35 0.35;
                to: ${finalScale} ${finalScale} ${finalScale};
                dur: ${duration};
                easing: easeOutQuad;
              `
            );


            note.setAttribute(
              "animation__dance",
              `
                property: rotation;
                from: 0 0 -${rotateAmount};
                to: 0 0 ${rotateAmount};
                dur: ${320 + Math.random() * 280};
                dir: alternate;
                loop: true;
                easing: easeInOutSine;
              `
            );


            note.setAttribute(
              "animation__fade",
              `
                property: material.opacity;
                from: 1;
                to: 0;
                delay: ${duration * 0.65};
                dur: ${duration * 0.35};
                easing: easeInQuad;
              `
            );


            target.appendChild(
              note
            );


            setTimeout(
              function () {

                if (note.parentNode) {

                  note.parentNode
                    .removeChild(
                      note
                    );

                }

              },

              duration + 200

            );

          }


          target.addEventListener(
            "targetFound",
            function () {

              running =
                true;


              if (!noteTimer) {

                createNote();

                noteTimer =
                  setInterval(
                    createNote,
                    350
                  );

              }

            }
          );


          target.addEventListener(
            "targetLost",
            function () {

              running =
                false;


              if (noteTimer) {

                clearInterval(
                  noteTimer
                );

                noteTimer =
                  null;

              }

            }
          );

        }

      }

    );





    /* ==========================================================
       TARGET 1
       BAND FORMATION NAMES
       ========================================================== */


    AFRAME.registerComponent(
      "spray-names",
      {

        init: function () {

          const target =
            this.el;

          let running =
            false;

          let timers =
            [];


          const names = [

            /* GAZ */

            {
              image: "#gazImage",
              x: -0.58,
              y: -0.30,
              rotation: -4,
              width: 1.24,
              height: 0.50,
              color: "#39ff14"
            },


            /* MICHAEL */

            {
              image: "#michaelImage",
              x: -0.20,
              y: 0.38,
              rotation: -2,
              width: 1.68,
              height: 0.50,
              color: "#bf00ff"
            },


            /* RYAN */

            {
              image: "#ryanImage",
              x: 0.58,
              y: 0.16,
              rotation: 4,
              width: 1.30,
              height: 0.50,
              color: "#ff1493"
            },


            /* NICK */

            {
              image: "#nickImage",
              x: 0.00,
              y: -0.38,
              rotation: 0,
              width: 1.32,
              height: 0.50,
              color: "#ffd700"
            },


            /* SEAN */

            {
              image: "#seanImage",
              x: 0.58,
              y: -0.30,
              rotation: 4,
              width: 1.32,
              height: 0.50,
              color: "#ff5a00"
            }

          ];



          /* =====================================================
             SPRAY MIST
             ===================================================== */

          function createSprayMist(
            x,
            y,
            color
          ) {

            for (
              let i = 0;
              i < 18;
              i++
            ) {

              const dot =
                document.createElement(
                  "a-circle"
                );


              const offsetX =

                (Math.random() - 0.5) *
                0.42;


              const offsetY =

                (Math.random() - 0.5) *
                0.15;


              const dotSize =

                0.004 +

                Math.random() *
                0.012;


              dot.classList.add(
                "spray-effect"
              );


              dot.setAttribute(
                "radius",
                dotSize
              );


              dot.setAttribute(
                "color",
                color
              );


              dot.setAttribute(
                "position",
                `
                  ${x + offsetX}
                  ${y + offsetY}
                  0.10
                `
              );


              dot.setAttribute(
                "material",
                `
                  shader: flat;
                  transparent: true;
                  opacity: 0.85;
                  side: double;
                  depthWrite: false;
                `
              );


              dot.setAttribute(
                "scale",
                "0 0 0"
              );


              dot.setAttribute(
                "animation__appear",
                `
                  property: scale;
                  from: 0 0 0;
                  to: 1 1 1;
                  dur: ${100 + Math.random() * 220};
                  easing: easeOutQuad;
                `
              );


              dot.setAttribute(
                "animation__fade",
                `
                  property: material.opacity;
                  from: 0.85;
                  to: 0;
                  delay: 250;
                  dur: 650;
                  easing: easeOutQuad;
                `
              );


              target.appendChild(
                dot
              );


              setTimeout(
                function () {

                  if (dot.parentNode) {

                    dot.parentNode
                      .removeChild(
                        dot
                      );

                  }

                },

                1000

              );

            }

          }



          /* =====================================================
             CREATE NAME
             ===================================================== */

          function createName(
            info,
            index
          ) {

            if (!running)
              return;


            createSprayMist(
              info.x,
              info.y,
              info.color
            );


            const name =
              document.createElement(
                "a-image"
              );


            name.classList.add(
              "spray-name"
            );


            name.setAttribute(
              "src",
              info.image
            );


            name.setAttribute(
              "position",
              `
                ${info.x}
                ${info.y}
                ${0.15 + index * 0.01}
              `
            );


            name.setAttribute(
              "rotation",
              `
                0 0 ${info.rotation}
              `
            );


            name.setAttribute(
              "width",
              info.width
            );


            name.setAttribute(
              "height",
              info.height
            );


            name.setAttribute(
              "material",
              `
                shader: flat;
                transparent: true;
                opacity: 1;
                alphaTest: 0.05;
                side: double;
                depthWrite: false;
              `
            );


            name.setAttribute(
              "scale",
              "0.05 0.05 0.05"
            );


            name.setAttribute(
              "animation__grow",
              `
                property: scale;
                from: 0.05 0.05 0.05;
                to: 1 1 1;
                dur: 450;
                easing: easeOutBack;
              `
            );


            name.setAttribute(
              "animation__shrink",
              `
                property: scale;
                from: 1 1 1;
                to: 0.52 0.52 0.52;
                delay: 850;
                dur: 500;
                easing: easeInOutQuad;
              `
            );


            target.appendChild(
              name
            );

          }



          /* =====================================================
             SHOW THE HOOK BUTTON
             ===================================================== */

          function showHookButton() {

            if (!running)
              return;


            const button =
              document.getElementById(
                "hookButton"
              );


            button.style.display =
              "block";


            requestAnimationFrame(
              function () {

                button.classList.add(
                  "show"
                );

              }
            );

          }



          /* =====================================================
             HIDE THE HOOK BUTTON
             ===================================================== */

          function hideHookButton() {

            const button =
              document.getElementById(
                "hookButton"
              );


            if (!button)
              return;


            button.classList.remove(
              "show"
            );


            button.style.display =
              "none";

          }



          /* =====================================================
             CLEAR EFFECTS
             ===================================================== */

          function clearEffects() {

            const effects =
              target.querySelectorAll(
                ".spray-name, .spray-effect"
              );


            effects.forEach(
              function (item) {

                if (item.parentNode) {

                  item.parentNode
                    .removeChild(
                      item
                    );

                }

              }
            );


            hideHookButton();

          }



          /* =====================================================
             TARGET FOUND
             ===================================================== */

          target.addEventListener(
            "targetFound",
            function () {

              running =
                true;


              clearEffects();


              timers.forEach(
                clearTimeout
              );


              timers =
                [];


              /* MICHAEL */

              timers.push(
                setTimeout(
                  function () {

                    createName(
                      names[1],
                      1
                    );

                  },

                  200

                )
              );


              /* RYAN */

              timers.push(
                setTimeout(
                  function () {

                    createName(
                      names[2],
                      2
                    );

                  },

                  1600

                )
              );


              /* GAZ */

              timers.push(
                setTimeout(
                  function () {

                    createName(
                      names[0],
                      0
                    );

                  },

                  3000

                )
              );


              /* NICK */

              timers.push(
                setTimeout(
                  function () {

                    createName(
                      names[3],
                      3
                    );

                  },

                  4400

                )
              );


              /* SEAN */

              timers.push(
                setTimeout(
                  function () {

                    createName(
                      names[4],
                      4
                    );

                  },

                  5800

                )
              );


              /* THE HOOK BUTTON */

              timers.push(
                setTimeout(
                  function () {

                    showHookButton();

                  },

                  7500

                )
              );

            }
          );



          /* =====================================================
             TARGET LOST
             ===================================================== */

          target.addEventListener(
            "targetLost",
            function () {

              running =
                false;


              timers.forEach(
                clearTimeout
              );


              timers =
                [];


              clearEffects();

            }
          );

        }

      }

    );



    /* ==========================================================
       THE HOOK BUTTON CLICK
       ========================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const hookButton =
          document.getElementById(
            "hookButton"
          );


        hookButton.addEventListener(
          "click",
          function () {

            window.location.href =
              "./face.html";

          }
        );

      }
    );


  </script>

</head>



<body>


<!-- ======================================================
     NORMAL HTML BUTTON
     ====================================================== -->

<button
  id="hookButton"
  type="button"
>
  THE HOOK

  <small>
    TAP FOR FACE FILTER
  </small>

</button>



<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
  "

  embedded

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

>


  <!-- ======================================================
       ASSETS
       ====================================================== -->

  <a-assets>


    <img
      id="blackHeart"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%232b2b2b' d='M50 87 C44 80 14 60 14 35 C14 19 34 12 50 29 C66 12 86 19 86 35 C86 60 56 80 50 87 Z'/%3E%3C/svg%3E"
    >


    <img
      id="seanImage"
      src="./sean.png"
      crossorigin="anonymous"
    >


    <img
      id="nickImage"
      src="./nick.png"
      crossorigin="anonymous"
    >


    <img
      id="ryanImage"
      src="./ryan.png"
      crossorigin="anonymous"
    >


    <img
      id="gazImage"
      src="./gaz.png"
      crossorigin="anonymous"
    >


    <img
      id="michaelImage"
      src="./michael.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <!-- ======================================================
       CAMERA
       ====================================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  >
  </a-camera>



  <!-- ======================================================
       TARGET 0
       ====================================================== -->

  <a-entity
    id="hookedTarget"
    mindar-image-target="targetIndex: 0"
    music-emitter
  >


    <a-image

      src="#blackHeart"

      position="0 0 -0.04"

      width="1.35"

      height="1.35"

      material="
        shader: flat;
        transparent: true;
        opacity: 0.78;
        side: double;
        depthWrite: false;
      "

      scale="1 1 1"

      animation__pulse="
        property: scale;
        from: 0.90 0.90 0.90;
        to: 1.14 1.14 1.14;
        dur: 650;
        dir: alternate;
        loop: true;
        easing: easeInOutQuad;
      "

      animation__fadepulse="
        property: material.opacity;
        from: 0.58;
        to: 0.88;
        dur: 650;
        dir: alternate;
        loop: true;
        easing: easeInOutQuad;
      "

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       TARGET 1
       ====================================================== -->

  <a-entity
    id="hookCatTarget"
    mindar-image-target="targetIndex: 1"
    spray-names
  >
  </a-entity>


</a-scene>


</body>

</html>
