<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR IMAGE TRACKING -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }


    /* ======================================================
       LET'S MEET THE BAND INTRO
       ====================================================== */

    #meetBandIntro {

      position: fixed;
      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -42%)
        scale(0.82);

      z-index: 99998;

      display: none;

      width: 88%;
      max-width: 460px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.65s ease,
        transform 0.65s ease;

    }


    #meetBandIntro.show {

      display: block;

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);

    }


    #meetBandIntro img {

      display: block;
      width: 100%;
      height: auto;

      filter:
        drop-shadow(
          0 8px 14px
          rgba(0,0,0,0.35)
        );

    }


    /* ======================================================
       FINAL THE HOOK FACE FILTER BUTTON
       ====================================================== */

    #hookButton {

      position: fixed;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -42%)
        scale(0.82);

      z-index: 99999;

      display: none;

      width: 84%;
      max-width: 430px;

      padding: 0;

      background: transparent;
      border: none;

      text-align: center;

      cursor: pointer;

      opacity: 0;

      -webkit-tap-highlight-color: transparent;

      transition:
        opacity 0.65s ease,
        transform 0.65s ease;

    }


    #hookButton.show {

      display: block;

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);

    }


    #hookButton:active {

      transform:
        translate(-50%, -50%)
        scale(0.96);

    }


    #hookButton img {

      display: block;

      width: 100%;
      height: auto;

      margin: 0 auto;

      pointer-events: none;

      filter:
        drop-shadow(
          0 8px 14px
          rgba(0,0,0,0.35)
        );

    }


    #hookButton small {

      display: inline-block;

      margin-top: 10px;

      padding: 9px 18px;

      border-radius: 22px;

      background:
        rgba(0,0,0,0.86);

      color: #f6d675;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 2px;

      animation:
        faceFilterPulse
        1.8s
        ease-in-out
        infinite;

    }


    @keyframes faceFilterPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.82;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }

    }


    /* ======================================================
       SCREEN-FIXED BAND NAMES
       Large like "Let's Meet The Band", then shrink into stack
       ====================================================== */

    #bandNameStack {
      position: fixed;
      inset: 0;
      z-index: 99997;
      pointer-events: none;
    }

    .band-screen-name {
      position: fixed;
      left: 50%;
      top: 50%;

      width: 88%;
      max-width: 460px;
      height: auto;

      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(0.92);

      transform-origin: center center;

      transition:
        left 0.65s ease,
        top 0.65s ease,
        width 0.65s ease,
        max-width 0.65s ease,
        opacity 0.25s ease,
        transform 0.65s cubic-bezier(.22,.9,.28,1);

      filter:
        drop-shadow(
          0 7px 12px
          rgba(0,0,0,0.32)
        );
    }

    /* BIG centred reveal */
    .band-screen-name.flash {
      left: 50%;
      top: 50%;

      width: 88%;
      max-width: 460px;

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);
    }

    /* Small, steady final position */
    .band-screen-name.stacked {
      left: var(--stack-left);
      top: var(--stack-top);

      width: 32%;
      max-width: 175px;

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);
    }

    /* Fade the completed stack before the final Hook button */
    .band-screen-name.fade-away {
      opacity: 0;
      transform:
        translate(-50%, -50%)
        scale(0.92);
    }


  </style>


  <script>


//* ==========================================================
   TARGET 0
   BUBBLE TAKEOVER + HEART BURST + MUSIC NOTES
   ========================================================== */

AFRAME.registerComponent("music-emitter", {

  init: function () {

    const target = this.el;

    let running = false;
    let noteTimer = null;
    let bubbleTimer = null;
    let timers = [];

    /* =========================================
       MUSIC NOTES — ORIGINAL LOCATION
       ========================================= */

    const ampX = -0.15;
    const ampY = -0.30;


    /* =========================================
       BUBBLES — CIGARETTE TIP
       ========================================= */

    const bubbleX = -0.15;
    const bubbleY = 0.30;


    /* =========================================
       HEART LOCATION
       ========================================= */

    const heartX = 0.10;
    const heartY = 0.25;


    const orange = "#FF5A00";


    /* =========================================
       MUSIC NOTE ART
       ========================================= */

    const notes = [

      `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="100"
           height="100"
           viewBox="0 0 100 100">

        <text
          x="50"
          y="74"
          text-anchor="middle"
          font-size="78"
          font-family="Arial, sans-serif"
          fill="${orange}"
        >♪</text>

      </svg>
      `,

      `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="100"
           height="100"
           viewBox="0 0 100 100">

        <text
          x="50"
          y="74"
          text-anchor="middle"
          font-size="74"
          font-family="Arial, sans-serif"
          fill="${orange}"
        >♫</text>

      </svg>
      `,

      `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="100"
           height="100"
           viewBox="0 0 100 100">

        <text
          x="50"
          y="74"
          text-anchor="middle"
          font-size="78"
          font-family="Arial, sans-serif"
          fill="${orange}"
        >♩</text>

      </svg>
      `

    ];


    function svgToDataURL(svg) {

      return (
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg)
      );

    }


    function later(fn, delay) {

      const id =
        setTimeout(fn, delay);

      timers.push(id);

      return id;

    }


    /* =========================================
       CREATE NORMAL MUSIC NOTE
       ========================================= */

    function createNote() {

      if (!running)
        return;


      const note =
        document.createElement(
          "a-plane"
        );


      note.classList.add(
        "target0-effect"
      );


      const svg =

        notes[
          Math.floor(
            Math.random() *
            notes.length
          )
        ];


      const startX =

        ampX +

        (Math.random() - 0.5) *
        0.025;


      const startY =

        ampY +

        (Math.random() - 0.5) *
        0.020;


      const driftX =

        (Math.random() - 0.5) *
        0.45;


      const rise =

        0.32 +

        Math.random() *
        0.42;


      const endX =
        startX + driftX;


      const endY =
        startY + rise;


      const duration =

        1800 +

        Math.random() *
        1300;


      const finalScale =

        0.50 +

        Math.random() *
        0.30;


      const rotateAmount =

        18 +

        Math.random() *
        30;


      note.setAttribute(
        "src",
        svgToDataURL(svg)
      );


      note.setAttribute(
        "material",
        `
        shader: flat;
        transparent: true;
        opacity: 1;
        side: double;
        alphaTest: 0.01;
        depthWrite: false;
        `
      );


      note.setAttribute(
        "width",
        "0.28"
      );


      note.setAttribute(
        "height",
        "0.28"
      );


      note.setAttribute(
        "position",
        `${startX} ${startY} 0.12`
      );


      note.setAttribute(
        "scale",
        "0.30 0.30 0.30"
      );


      note.setAttribute(
        "animation__move",
        `
        property: position;
        from: ${startX} ${startY} 0.12;
        to: ${endX} ${endY} 0.12;
        dur: ${duration};
        easing: easeOutSine;
        `
      );


      note.setAttribute(
        "animation__grow",
        `
        property: scale;
        from: 0.30 0.30 0.30;
        to: ${finalScale} ${finalScale} ${finalScale};
        dur: ${duration};
        easing: easeOutQuad;
        `
      );


      note.setAttribute(
        "animation__dance",
        `
        property: rotation;
        from: 0 0 -${rotateAmount};
        to: 0 0 ${rotateAmount};
        dur: ${320 + Math.random() * 280};
        dir: alternate;
        loop: true;
        easing: easeInOutSine;
        `
      );


      note.setAttribute(
        "animation__fade",
        `
        property: material.opacity;
        from: 1;
        to: 0;
        delay: ${duration * 0.65};
        dur: ${duration * 0.35};
        easing: easeInQuad;
        `
      );


      target.appendChild(note);


      later(
        function () {

          if (note.parentNode) {

            note.parentNode
              .removeChild(note);

          }

        },

        duration + 200

      );

    }



    /* =========================================
       CREATE GLASS BUBBLE
       ========================================= */

    function createBubble(stage) {

      if (!running)
        return;


      const bubble =
        document.createElement(
          "a-plane"
        );


      bubble.classList.add(
        "target0-effect",
        "hook-bubble"
      );


      /* Bubble SVG:
         transparent middle
         pale rim
         white shine */

      const bubbleSVG = `

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="100"
          viewBox="0 0 100 100"
        >

          <circle
            cx="50"
            cy="50"
            r="43"
            fill="rgba(255,255,255,0.08)"
            stroke="rgba(255,255,255,0.85)"
            stroke-width="4"
          />

          <circle
            cx="35"
            cy="31"
            r="8"
            fill="rgba(255,255,255,0.90)"
          />

          <circle
            cx="68"
            cy="69"
            r="4"
            fill="rgba(255,90,0,0.45)"
          />

        </svg>

      `;


      let endX;
      let endY;
      let size;
      let duration;


      /* =========================================
         EARLY BUBBLES
         Stay near cigarette
         ========================================= */

      if (stage === 1) {

        endX =

          bubbleX +

          (Math.random() - 0.5) *
          0.35;


        endY =

          bubbleY +

          0.20 +

          Math.random() *
          0.35;


        size =

          0.10 +

          Math.random() *
          0.12;


        duration =

          1400 +

          Math.random() *
          700;

      }


      /* =========================================
         TAKEOVER BUBBLES
         Spread over the view
         ========================================= */

      else {

        endX =

          (Math.random() - 0.5) *
          1.65;


        endY =

          (Math.random() - 0.5) *
          1.70;


        size =

          0.20 +

          Math.random() *
          0.34;


        duration =

          900 +

          Math.random() *
          700;

      }


      bubble.setAttribute(
        "src",
        svgToDataURL(
          bubbleSVG
        )
      );


      bubble.setAttribute(
        "material",
        `
        shader: flat;
        transparent: true;
        opacity: 0.90;
        side: double;
        depthWrite: false;
        `
      );


      bubble.setAttribute(
        "width",
        size
      );


      bubble.setAttribute(
        "height",
        size
      );


      bubble.setAttribute(
        "position",
        `${bubbleX} ${bubbleY} 0.15`
      );


      bubble.setAttribute(
        "scale",
        "0.15 0.15 0.15"
      );


      bubble.setAttribute(
        "animation__move",
        `
        property: position;
        from: ${bubbleX} ${bubbleY} 0.15;
        to: ${endX} ${endY} 0.15;
        dur: ${duration};
        easing: easeOutSine;
        `
      );


      bubble.setAttribute(
        "animation__grow",
        `
        property: scale;
        from: 0.15 0.15 0.15;
        to: 1 1 1;
        dur: ${duration * 0.70};
        easing: easeOutQuad;
        `
      );


      target.appendChild(
        bubble
      );


      /* Keep takeover bubbles alive
         until heart punches through */

      if (stage === 1) {

        later(
          function () {

            if (bubble.parentNode) {

              bubble.parentNode
                .removeChild(bubble);

            }

          },

          duration + 300

        );

      }

    }



    /* =========================================
       HEART BURST THROUGH BUBBLES
       ========================================= */

    function heartBurst() {

      if (!running)
        return;


      const heart =
        target.querySelector(
          "#hookHeartAR"
        );


      if (!heart)
        return;


      /* HEART BECOMES VISIBLE */

      heart.setAttribute(
        "material",
        `
        shader: flat;
        transparent: true;
        opacity: 1;
        side: double;
        depthWrite: false;
        `
      );


      /* START TINY */

      heart.setAttribute(
        "scale",
        "0.05 0.05 0.05"
      );


      /* BIG PUNCH THROUGH */

      heart.setAttribute(
        "animation__burst",
        `
        property: scale;
        from: 0.05 0.05 0.05;
        to: 0.75 0.75 0.75;
        dur: 350;
        easing: easeOutBack;
        `
      );


      /* =========================================
         THROW ALL BUBBLES OUTWARD
         ========================================= */

      const bubbles =
        target.querySelectorAll(
          ".hook-bubble"
        );


      bubbles.forEach(
        function (bubble) {

          bubble.removeAttribute(
            "animation__move"
          );


          const pos =
            bubble.getAttribute(
              "position"
            );


          let dx =
            pos.x - heartX;


          let dy =
            pos.y - heartY;


          let length =
            Math.sqrt(
              dx * dx +
              dy * dy
            );


          if (length < 0.01) {

            dx =
              Math.random() - 0.5;

            dy =
              Math.random() - 0.5;

            length =
              Math.sqrt(
                dx * dx +
                dy * dy
              );

          }


          dx /= length;
          dy /= length;


          const distance =

            0.75 +

            Math.random() *
            0.70;


          const blastX =

            pos.x +

            dx *
            distance;


          const blastY =

            pos.y +

            dy *
            distance;


          bubble.setAttribute(
            "animation__blast",
            `
            property: position;
            from: ${pos.x} ${pos.y} 0.15;
            to: ${blastX} ${blastY} 0.15;
            dur: ${450 + Math.random() * 300};
            easing: easeOutQuad;
            `
          );


          bubble.setAttribute(
            "animation__blastfade",
            `
            property: material.opacity;
            from: 0.90;
            to: 0;
            dur: 600;
            easing: easeOutQuad;
            `
          );


          later(
            function () {

              if (bubble.parentNode) {

                bubble.parentNode
                  .removeChild(
                    bubble
                  );

              }

            },

            800

          );

        }
      );


      /* =========================================
         HEART SETTLES SMALL
         ========================================= */

      later(
        function () {

          if (!running)
            return;


          heart.removeAttribute(
            "animation__burst"
          );


          heart.setAttribute(
            "scale",
            "0.49 0.49 0.49"
          );


          heart.setAttribute(
            "animation__pulse",
            `
            property: scale;
            from: 0.46 0.46 0.46;
            to: 0.52 0.52 0.52;
            dur: 900;
            dir: alternate;
            loop: true;
            easing: easeInOutSine;
            `
          );

        },

        420

      );

    }



    /* =========================================
       CLEAR TARGET 0
       ========================================= */

    function clearTarget0() {

      timers.forEach(
        clearTimeout
      );


      timers = [];


      if (bubbleTimer) {

        clearInterval(
          bubbleTimer
        );

        bubbleTimer = null;

      }


      if (noteTimer) {

        clearInterval(
          noteTimer
        );

        noteTimer = null;

      }


      target
        .querySelectorAll(
          ".target0-effect"
        )
        .forEach(
          function (item) {

            if (item.parentNode) {

              item.parentNode
                .removeChild(item);

            }

          }
        );


      const heart =
        target.querySelector(
          "#hookHeartAR"
        );


      if (heart) {

        heart.removeAttribute(
          "animation__burst"
        );


        heart.removeAttribute(
          "animation__pulse"
        );


        heart.setAttribute(
          "scale",
          "0.45 0.45 0.45"
        );


        heart.setAttribute(
          "material",
          `
          shader: flat;
          transparent: true;
          opacity: 0;
          side: double;
          depthWrite: false;
          `
        );

      }

    }



    /* =========================================
       TARGET FOUND
       ========================================= */

    target.addEventListener(
      "targetFound",

      function () {

        running = true;


        clearTarget0();


        /* -----------------------------------------
           0–1 SECOND
           Gentle bubbles from cigarette
           ----------------------------------------- */

        let bubbleStage = 1;


        bubbleTimer =
          setInterval(
            function () {

              createBubble(
                bubbleStage
              );

            },

            170
          );


        /* -----------------------------------------
           AFTER 1 SECOND
           TAKEOVER BEGINS
           ----------------------------------------- */

        later(
          function () {

            bubbleStage = 2;


            clearInterval(
              bubbleTimer
            );


            bubbleTimer =
              setInterval(
                function () {

                  createBubble(2);

                  /* Make some moments denser */

                  if (
                    Math.random() >
                    0.35
                  ) {

                    createBubble(2);

                  }

                },

                95
              );

          },

          1000

        );


        /* -----------------------------------------
           3.25 SECONDS
           STOP MAKING BUBBLES
           ----------------------------------------- */

        later(
          function () {

            if (bubbleTimer) {

              clearInterval(
                bubbleTimer
              );

              bubbleTimer =
                null;

            }

          },

          3250

        );


        /* -----------------------------------------
           3.4 SECONDS
           HEART PUNCHES THROUGH
           ----------------------------------------- */

        later(
          function () {

            heartBurst();

          },

          3400

        );


        /* -----------------------------------------
           3.75 SECONDS
           MUSIC NOTES BEGIN
           ----------------------------------------- */

        later(
          function () {

            if (!running)
              return;


            createNote();


            noteTimer =
              setInterval(
                createNote,
                350
              );

          },

          3750

        );

      }
    );



    /* =========================================
       TARGET LOST
       ========================================= */

    target.addEventListener(
      "targetLost",

      function () {

        running = false;

        clearTarget0();

      }
    );

  }

});


    /* ==========================================================
       TARGET 1
       BAND FORMATION NAMES
       ========================================================== */


    AFRAME.registerComponent(
      "spray-names",
      {

        init: function () {

          const target =
            this.el;

          let running =
            false;

          let timers =
            [];


          const names = [

            /* GAZ */

            {
              image: "#gazImage",
              x: -0.58,
              y: -0.30,
              rotation: -4,
              width: 1.24,
              height: 0.50,
              color: "#39ff14"
            },


            /* MICHAEL */

            {
              image: "#michaelImage",
              x: -0.58,
              y: -0.38,
              rotation: -2,
              width: 1.68,
              height: 0.50,
              color: "#bf00ff"
            },


            /* RYAN */

            {
              image: "#ryanImage",
              x: 0.58,
              y: 0.16,
              rotation: 4,
              width: 1.30,
              height: 0.50,
              color: "#ff1493"
            },


            /* NICK */

            {
              image: "#nickImage",
              x: 0.00,
              y: -0.38,
              rotation: 0,
              width: 1.32,
              height: 0.50,
              color: "#ffd700"
            },


            /* SEAN */

            {
              image: "#seanImage",
              x: 0.58,
              y: -0.30,
              rotation: 4,
              width: 1.32,
              height: 0.50,
              color: "#ff5a00"
            }

          ];



          /* =====================================================
             SPRAY MIST
             ===================================================== */

          function createSprayMist(
            x,
            y,
            color
          ) {

            for (
              let i = 0;
              i < 18;
              i++
            ) {

              const dot =
                document.createElement(
                  "a-circle"
                );


              const offsetX =

                (Math.random() - 0.5) *
                0.42;


              const offsetY =

                (Math.random() - 0.5) *
                0.15;


              const dotSize =

                0.004 +

                Math.random() *
                0.012;


              dot.classList.add(
                "spray-effect"
              );


              dot.setAttribute(
                "radius",
                dotSize
              );


              dot.setAttribute(
                "color",
                color
              );


              dot.setAttribute(
                "position",
                `
                  ${x + offsetX}
                  ${y + offsetY}
                  0.10
                `
              );


              dot.setAttribute(
                "material",
                `
                  shader: flat;
                  transparent: true;
                  opacity: 0.85;
                  side: double;
                  depthWrite: false;
                `
              );


              dot.setAttribute(
                "scale",
                "0 0 0"
              );


              dot.setAttribute(
                "animation__appear",
                `
                  property: scale;
                  from: 0 0 0;
                  to: 1 1 1;
                  dur: ${100 + Math.random() * 220};
                  easing: easeOutQuad;
                `
              );


              dot.setAttribute(
                "animation__fade",
                `
                  property: material.opacity;
                  from: 0.85;
                  to: 0;
                  delay: 250;
                  dur: 650;
                  easing: easeOutQuad;
                `
              );


              target.appendChild(
                dot
              );


              setTimeout(
                function () {

                  if (dot.parentNode) {

                    dot.parentNode
                      .removeChild(
                        dot
                      );

                  }

                },

                1000

              );

            }

          }



          /* =====================================================
             CREATE NAME
             ===================================================== */

          function createName(
            info,
            index
          ) {

            if (!running)
              return;


            createSprayMist(
              info.x,
              info.y,
              info.color
            );


            const name =
              document.createElement(
                "a-image"
              );


            name.classList.add(
              "spray-name"
            );


            name.setAttribute(
              "src",
              info.image
            );


            /* ===============================================
               START HUGE + FLAT IN THE CENTRE

               The name begins at the centre of the target,
               straight-on and very large so it reads like a
               full-screen flash before retracting.
               =============================================== */

            name.setAttribute(
              "position",
              "0 0 0.01"
            );


            name.setAttribute(
              "rotation",
              "0 0 0"
            );


            name.setAttribute(
              "width",
              info.width
            );


            name.setAttribute(
              "height",
              info.height
            );


            name.setAttribute(
              "material",
              `
                shader: flat;
                transparent: true;
                opacity: 1;
                alphaTest: 0.05;
                side: double;
                depthWrite: false;
              `
            );


            /* Huge initial flash. Increase 2.8 if you want
               the name to fill even more of the screen. */

            name.setAttribute(
              "scale",
              "2.8 2.8 2.8"
            );


            target.appendChild(
              name
            );


            /* Hold the big name briefly, then retract it to
               its permanent band-member location. */

            name.setAttribute(
              "animation__retractPosition",
              `
                property: position;
                from: 0 0 0.01;
                to: ${info.x} ${info.y} 0;
                delay: 500;
                dur: 700;
                easing: easeInOutCubic;
              `
            );


            name.setAttribute(
              "animation__retractScale",
              `
                property: scale;
                from: 2.8 2.8 2.8;
                to: 0.52 0.52 0.52;
                delay: 500;
                dur: 700;
                easing: easeInOutCubic;
              `
            );


            name.setAttribute(
              "animation__retractRotation",
              `
                property: rotation;
                from: 0 0 0;
                to: 0 0 ${info.rotation};
                delay: 500;
                dur: 700;
                easing: easeInOutCubic;
              `
            );


            /* After the retract finishes, force the exact
               final values so the name stays completely
               steady with Z = 0. */

            timers.push(
              setTimeout(
                function () {

                  if (!running || !name.parentNode)
                    return;

                  name.removeAttribute(
                    "animation__retractPosition"
                  );

                  name.removeAttribute(
                    "animation__retractScale"
                  );

                  name.removeAttribute(
                    "animation__retractRotation"
                  );

                  name.setAttribute(
                    "position",
                    `${info.x} ${info.y} 0`
                  );

                  name.setAttribute(
                    "scale",
                    "0.52 0.52 0.52"
                  );

                  name.setAttribute(
                    "rotation",
                    `0 0 ${info.rotation}`
                  );

                },
                1250
              )
            );

          }



          /* =====================================================
             SHOW / HIDE LET'S MEET THE BAND INTRO
             ===================================================== */

          function showMeetBandIntro() {

            if (!running)
              return;


            const intro =
              document.getElementById(
                "meetBandIntro"
              );


            if (!intro)
              return;


            intro.style.display =
              "block";


            requestAnimationFrame(
              function () {

                intro.classList.add(
                  "show"
                );

              }
            );

          }



          function hideMeetBandIntro() {

            const intro =
              document.getElementById(
                "meetBandIntro"
              );


            if (!intro)
              return;


            intro.classList.remove(
              "show"
            );


            setTimeout(
              function () {

                if (
                  !intro.classList.contains(
                    "show"
                  )
                ) {

                  intro.style.display =
                    "none";

                }

              },
              700
            );

          }



          /* =====================================================
             SCREEN NAME OVERLAY
             ===================================================== */

          function resetScreenNames() {

            const screenNames =
              document.querySelectorAll(
                ".band-screen-name"
              );


            screenNames.forEach(
              function (img) {

                img.classList.remove(
                  "flash",
                  "stacked",
                  "fade-away"
                );

                img.style.opacity =
                  "0";

              }
            );

          }



          function revealScreenName(id) {

            if (!running)
              return;


            const img =
              document.getElementById(id);


            if (!img)
              return;


            img.classList.remove(
              "stacked",
              "fade-away"
            );


            img.style.opacity =
              "";


            /* Large, centred reveal */

            requestAnimationFrame(
              function () {

                img.classList.add(
                  "flash"
                );

              }
            );


            /* Shrink smoothly into its stack position */

            timers.push(
              setTimeout(
                function () {

                  if (!running)
                    return;


                  img.classList.remove(
                    "flash"
                  );


                  img.classList.add(
                    "stacked"
                  );

                },

                700

              )
            );

          }



          function fadeScreenNames() {

            const screenNames =
              document.querySelectorAll(
                ".band-screen-name.stacked"
              );


            screenNames.forEach(
              function (img) {

                img.classList.add(
                  "fade-away"
                );

              }
            );

          }




          /* =====================================================
             SHOW THE HOOK BUTTON
             ===================================================== */

          function showHookButton() {

            if (!running)
              return;


            const button =
              document.getElementById(
                "hookButton"
              );


            button.style.display =
              "block";


            requestAnimationFrame(
              function () {

                button.classList.add(
                  "show"
                );

              }
            );

          }



          /* =====================================================
             HIDE THE HOOK BUTTON
             ===================================================== */

          function hideHookButton() {

            const button =
              document.getElementById(
                "hookButton"
              );


            if (!button)
              return;


            button.classList.remove(
              "show"
            );


            button.style.display =
              "none";

          }



          /* =====================================================
             CLEAR EFFECTS
             ===================================================== */

          function clearEffects() {

            const effects =
              target.querySelectorAll(
                ".spray-name, .spray-effect"
              );


            effects.forEach(
              function (item) {

                if (item.parentNode) {

                  item.parentNode
                    .removeChild(
                      item
                    );

                }

              }
            );


            hideHookButton();

            hideMeetBandIntro();

            resetScreenNames();

          }



          /* =====================================================
             TARGET FOUND
             ===================================================== */

          target.addEventListener(
            "targetFound",
            function () {

              running =
                true;


              clearEffects();


              timers.forEach(
                clearTimeout
              );


              timers =
                [];


              /* LET'S MEET THE BAND INTRO */

              showMeetBandIntro();


              timers.push(
                setTimeout(
                  function () {

                    hideMeetBandIntro();

                  },

                  1900

                )
              );


              /* =================================================
                 BAND NAMES
                 Order:
                 NICK -> SEAN -> GAZ -> RYAN -> MICHAEL

                 Each name:
                 1. appears large in the centre
                 2. shrinks into the vertical stack
                 3. stays completely steady
                 ================================================= */


              /* NICK */

              timers.push(
                setTimeout(
                  function () {

                    revealScreenName(
                      "screenNick"
                    );

                  },

                  2200

                )
              );


              /* SEAN */

              timers.push(
                setTimeout(
                  function () {

                    revealScreenName(
                      "screenSean"
                    );

                  },

                  3500

                )
              );


              /* GAZ */

              timers.push(
                setTimeout(
                  function () {

                    revealScreenName(
                      "screenGaz"
                    );

                  },

                  4800

                )
              );


              /* RYAN */

              timers.push(
                setTimeout(
                  function () {

                    revealScreenName(
                      "screenRyan"
                    );

                  },

                  6100

                )
              );


              /* MICHAEL */

              timers.push(
                setTimeout(
                  function () {

                    revealScreenName(
                      "screenMichael"
                    );

                  },

                  7400

                )
              );


              /* Hold the full five-name stack briefly,
                 then fade it away */

              timers.push(
                setTimeout(
                  function () {

                    fadeScreenNames();

                  },

                  10100

                )
              );


              /* FINAL THE HOOK FACE FILTER BUTTON */

              timers.push(
                setTimeout(
                  function () {

                    showHookButton();

                  },

                  10800

                )
              );

            }
          );



          /* =====================================================
             TARGET LOST
             ===================================================== */

          target.addEventListener(
            "targetLost",
            function () {

              running =
                false;


              timers.forEach(
                clearTimeout
              );


              timers =
                [];


              clearEffects();

            }
          );

        }

      }

    );



    /* ==========================================================
       THE HOOK BUTTON CLICK
       ========================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const hookButton =
          document.getElementById(
            "hookButton"
          );


        hookButton.addEventListener(
          "click",
          function () {

            window.location.href =
              "./face.html";

          }
        );

      }
    );


  </script>

</head>



<body>


<!-- ======================================================
     TARGET 1 INTRO: LET'S MEET THE BAND
     ====================================================== -->

<div id="meetBandIntro">

  <img
    src="./meettheband.png"
    alt="Let's Meet The Band"
  >

</div>


<!-- ======================================================
     SCREEN-FIXED BAND NAME STACK

     Final stack order:
     NICK
     SEAN
     GAZ
     RYAN
     MICHAEL
     ====================================================== -->

<div id="bandNameStack">

  <img
    id="screenNick"
    class="band-screen-name"
    src="./nick.png"
    alt="Nick"
    style="--stack-top: 18%; --stack-left: 40%;"
  >

  <img
    id="screenSean"
    class="band-screen-name"
    src="./sean.png"
    alt="Sean"
    style="--stack-top: 34%; --stack-left: 60%;"
  >

  <img
    id="screenGaz"
    class="band-screen-name"
    src="./gaz.png"
    alt="Gaz"
    style="--stack-top: 50%; --stack-left: 40%;"
  >

  <img
    id="screenRyan"
    class="band-screen-name"
    src="./ryan.png"
    alt="Ryan"
    style="--stack-top: 66%; --stack-left: 60%;"
  >

  <img
    id="screenMichael"
    class="band-screen-name"
    src="./michael.png"
    alt="Michael"
    style="--stack-top: 82%; --stack-left: 40%;"
  >

</div>



<!-- ======================================================
     FINAL THE HOOK FACE FILTER BUTTON
     ====================================================== -->

<button
  id="hookButton"
  type="button"
  aria-label="Open The Hook face filter"
>

  <img
    src="./hooklogo.png"
    alt="The Hook"
  >

  <small>
  
  </small>

</button>



<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
  "

  embedded

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

>


  <!-- ======================================================
       ASSETS
       ====================================================== -->

  <a-assets>


    <img
      id="hookHeart"
      src="./hookheart.png"
      crossorigin="anonymous"
    >


    <img
      id="seanImage"
      src="./sean.png"
      crossorigin="anonymous"
    >


    <img
      id="nickImage"
      src="./nick.png"
      crossorigin="anonymous"
    >


    <img
      id="ryanImage"
      src="./ryan.png"
      crossorigin="anonymous"
    >


    <img
      id="gazImage"
      src="./gaz.png"
      crossorigin="anonymous"
    >


    <img
      id="michaelImage"
      src="./michael.png"
      crossorigin="anonymous"
    >


  </a-assets>



  <!-- ======================================================
       CAMERA
       ====================================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  >
  </a-camera>



  <!-- ======================================================
       TARGET 0
       ====================================================== -->

  <a-entity
    id="hookedTarget"
    mindar-image-target="targetIndex: 0"
    music-emitter
  >


    <a-image
      id="hookHeartAR"
      
      src="#hookHeart"

      position=".1 .25 0.02"

      width=".45"

      height=".45"

      material="
        shader: flat;
        transparent: true;
        opacity: 0;
        side: double;
        depthWrite: false;
      "

      scale="0.45 0.45 0.45"

      

    >
    </a-image>


  </a-entity>



  <!-- ======================================================
       TARGET 1
       ====================================================== -->

  <a-entity
    id="hookCatTarget"
    mindar-image-target="targetIndex: 1"
    spray-names
  >
  </a-entity>


</a-scene>


</body>

</html>
